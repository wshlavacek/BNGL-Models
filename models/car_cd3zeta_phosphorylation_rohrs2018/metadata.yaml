  orcid: 0000-0003-4383-8711
  github: wshlavacek

source:
  tags: [literature, originally_rule_based, restructuration, ai_assisted]
  description: >
    Built from Rohrs JA, Zheng D, Graham NA, Wang P, Finley SD (2018), Biophys J
    115:1116-1129, and from the five BioNetGen files the authors published as
    Data S1-S5 (mmc2-mmc6.pdf) together with the phosphatase equation summary
    Data S6 (mmc7.pdf). Mechanisms, parameter values and initial conditions are
    the authors'. The representation is harmonized: the authors write CD3zeta as
    one six-tyrosine molecule in Data S1, as a six-site complex bound to a
    phosphate counter in Data S3, and as six independent molecule types in
    Data S2, S4 and S5; every file here uses the single six-tyrosine CD3zeta
    molecule of Data S1. That is exact for everything the paper reports -- no
    rate law depends on the state of a neighboring site, so the sites stay
    statistically independent, which the verification notebook checks directly --
    and it additionally resolves the joint phosphoform distribution, including
    the doubly phosphorylated ITAM that binds ZAP-70.

files:
  - name: car_cd3zeta_phosphorylation_rohrs2018.bngl
    role: primary
    description: >
      Competitive inhibition mechanism (Eqs. 4 and 5), the best of the four
      candidates by residual error and AIC. Wild-type CD3zeta on liposomes;
      65 species, 192 reactions. Reproduces Fig. 3D and Fig. S5A.
    documentation_target: standard
    rating:
    min_bionetgen_version: ">=2.9.3"
  - name: car_cd3zeta_phosphorylation_rohrs2018_sequential.bngl
    role: variant
    description: >
      Sequential-order mechanism (Data S1): LCK works down the fixed chain A1,
      B2, B1, A2, C2, C1, so only 7 of the 64 phosphoforms are reachable
      (8 species, 6 reactions). Reproduces Fig. 3A qualitatively -- the Hill
      coefficient climbing along the chain -- but not quantitatively; see the
      note on Data S1 below.
    documentation_target: standard
    rating:
    min_bionetgen_version: ">=2.9.3"
  - name: car_cd3zeta_phosphorylation_rohrs2018_random.bngl
    role: variant
    description: >
      Random-order mechanism (Data S2): six independent Michaelis-Menten
      substrates, no coupling of any kind. 65 species, 192 reactions.
      Reproduces Fig. 3B.
    documentation_target: standard
    rating:
    min_bionetgen_version: ">=2.9.3"
  - name: car_cd3zeta_phosphorylation_rohrs2018_priming.bngl
    role: variant
    description: >
      Phosphate-priming mechanism of Mukhopadhyay et al. (2016) (Data S3): the
      Michaelis constant of every site on a chain is divided by lambda^p with p
      the phosphates already on that chain, carried as a num state rather than
      the bound counter molecule of the source file. 65 species, 192 reactions
      through 36 rules. Reproduces Fig. 3C.
    documentation_target: standard
    rating:
    min_bionetgen_version: ">=2.9.3"
  - name: car_cd3zeta_phosphorylation_rohrs2018_mutants.bngl
    role: variant
    description: >
      Competitive inhibition applied to the six tyrosine-to-phenylalanine ITAM
      point mutants, all seven constructs in one network (257 species, 672
      reactions) and selected by setConcentration. Reproduces Fig. S5, D-J.
    documentation_target: standard
    rating:
    min_bionetgen_version: ">=2.9.3"
  - name: car_cd3zeta_phosphorylation_rohrs2018_phosphatase.bngl
    role: variant
    description: >
      Competitive inhibition plus a phosphatase acting through the mirror-image
      mechanism (Data S5, equations in Data S6), at the initial conditions of
      Mukhopadhyay et al. (2016). Seven ITAM configurations in one network
      (126 species, 600 reactions), each scanned over four decades of
      phosphatase density. Reproduces Fig. 5, A-C.
    documentation_target: standard
    rating:
    min_bionetgen_version: ">=2.9.3"
  - name: verify_rohrs2018.ipynb
    role: verification
    description: >
      Transcribes Eqs. 2-5 and the Data S6 phosphatase equations independently in
      SciPy -- as six site-density ODEs for the mechanisms whose sites are
      uncoupled, and as a 64-state master equation over bit-mask phosphoforms for
      phosphate priming -- and matches BioNetGen to 1e-3 percentage points or
      better on all six files. Checks per-site conservation, the sequential
      chain ordering, and the site-independence identity that licenses the
      authors' six-molecule representation. Compares the simulations against all
      21 digitized reference series: the nine Fig. S5 model curves (<= 1.6
      percentage points), the Fig. S5 measurements (same residual as the authors'
      own published fit, SSE 1.25e4 against 1.27e4 over 354 points), the Fig. 3
      half-maximal times and Hill coefficients of all four mechanisms, and the
      Fig. 5 phosphatase response, EC50 shifts and Hill coefficients.
  - name: verify_rohrs2018.png
    role: figure
  - name: digitize_rohrs2018.py
    role: verification
    description: >
      Regenerates every reference/rohrs2018_*_digitized.csv from the article PDF,
      which lives in the uncommitted dev/papers tree. Fig. S5 is vector art, so
      each marker, error bar and curve vertex is recovered exactly; data-point
      positions are taken from the error-bar segments rather than the marker
      glyphs, whose paths in this PDF carry a systematic offset of about 0.15 pt.
      Figs. 3 and 5 are raster and are read by colour segmentation with each
      panel calibrated on its own tick marks.

