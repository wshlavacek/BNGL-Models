source:
  tags: [literature, adapted_from_bngl, originally_rule_based, ai_assisted]
  description: >
    Curated from McKane and Newman (2005), Physical Review Letters 94:218102,
    and the accompanying volterra.bngl reference file. The primary model is a
    finite-capacity individual-level predator-prey process in which demographic
    noise resonantly amplifies stochastic cycles around a stable mean-field
    coexistence point. Verification preserves the supplied reaction
    propensities. The paper never states the Fig. 1 initial populations, and
    the supplied file assumed 800 predators and 800 prey; that assumption has
    been confirmed against the digitized Fig. 1, whose prey transient dip
    floor of 0.1456 matches the mean-field 0.1461 for 800/800 and excludes
    anything more than about 25 individuals away. The published time axis runs
    a uniform factor of about two slower than the model's, seen both in the
    Fig. 1 transient timing and in the 0.4937 frequency scale fitted for
    Fig. 2; it is a pure rescaling of time and leaves the Eq. 5 fixed point and
    every transient amplitude unchanged.

