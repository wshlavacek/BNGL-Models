# metadata.yaml - early_fceri_signaling_faeder2003
id: early_fceri_signaling_faeder2003
created: 2026-06-04

point_of_contact:
  name: William S. Hlavacek
  email: hlavacek@lanl.gov
  orcid: 0000-0003-4383-8711
  github: wshlavacek

source:
  tags: [literature, originally_rule_based, adapted_from_bngl, ai_assisted]
  description: >
    House-style curation of dev/papers/Faeder2003/fceri_ji.bngl,
    based on Faeder et al. (2003), Journal of Immunology 170:3769-3781.
    The source model encodes the early FceRI signaling network described
    in the paper and uses scaled molecule counts with deterministic ODE
    simulation. The _fyn variant adapts the fceri_fyn.bngl demonstration
    model distributed with BioNetGen, adding the Src-family kinase Fyn and
    Src activation-loop transphosphorylation; this extension is beyond the
    published paper. It corrects a rule ("Fyn phosphorylation by SH2-bound
    Lyn") that is unreachable-as-distributed and generates zero reactions.
    The primary reproduces Fig. 3 of the paper (model curves after 1.6 nM IgE
    dimer, 0-70 min) when its model block, unchanged, is run at that dose
    (Lig_tot = 963.5 scaled molecules): verify_faeder2003.ipynb compares it
    with the nine curves digitized by digitize_faeder2003.py from the
    publisher's figure raster, and with the numbers the Results section reads
    off them. The file's own active protocol is a different published
    condition: Lig_tot = 6000 is 10 nM at 1e6 cells/ml, run for 10 min, the
    condition of Figs. 4 and 7, although the .bngl header describes it as a
    Fig. 3-style time course. The .bngl is left unchanged (sha256 7dc745c0...,
    pinned downstream).

files:
  - name: early_fceri_signaling_faeder2003.bngl
    role: primary
    description: >
      Early FceRI signaling model for IgE-dimer-induced receptor
      aggregation, Lyn-mediated receptor phosphorylation, Syk recruitment,
      and Syk activation-loop transphosphorylation.
    documentation_target: standard
    scale: minutes
    min_bionetgen_version: "2.9.3"
  - name: early_fceri_signaling_faeder2003_fyn.bngl
    role: variant
    description: >
      Adds the Src-family kinase Fyn (competing with SH2-recruited Lyn for
      phosphorylated receptor beta) and activation-loop transphosphorylation
      of receptor-associated Lyn and Fyn. Adapted from the BioNetGen
      fceri_fyn.bngl demonstration model; beyond the published paper. The
      "Fyn phosphorylation by SH2-bound Lyn" rule is corrected relative to
      the distributed model (1281 species, 15328 reactions).
    documentation_target: standard
    scale: minutes
    min_bionetgen_version: "2.9.3"
  - name: verify_faeder2003.ipynb
    role: verification
    description: >
      Runs BioNetGen, confirms committed reference output, and independently
      integrates the generated mass-action ODE network with SciPy, for the
      primary 354-species model and the 1281-species _fyn variant. For the
      primary it then runs the committed model block under the Fig. 3
      protocol (1.6 nM IgE dimer, 70 min, ODE) and asserts the nine Fig. 3
      model curves, computed from the species by an independent
      classification, against the digitized curves (per curve RMSE <= 0.5%
      and max <= 1% of panel full scale, half a plotted stroke), shows that
      0.9x and 1.1x the dose fail, and asserts the nine numbers stated in the
      Results at their quoted precision.
  - name: digitize_faeder2003.py
    role: verification
    description: >
      Recovers the nine model curves of Fig. 3 from the publisher's raster of
      the figure (im0735521003.jpeg, sha256-checked, not committed;
      dev/papers/Faeder2003/), with tick-fitted calibration, and regenerates
      the four reference/faeder2003_fig3*_digitized.csv byte for byte. The
      densitometry points are not digitized.
  - name: verify_faeder2003.png
    role: figure
    description: >
      Level 1 (BNG vs SciPy, both protocols), the aggregate parity of all
      digitized Fig. 3 points, the dose sensitivity of the check, and the four
      Fig. 3 panels redrawn with residuals and tolerance bands.
  - name: verify_faeder2003_fyn.png
    role: figure
  - name: reference/early_fceri_signaling_faeder2003.net
    role: reference
  - name: reference/early_fceri_signaling_faeder2003_ode.net
    role: reference
  - name: reference/early_fceri_signaling_faeder2003_ode.gdat
    role: reference
  - name: reference/early_fceri_signaling_faeder2003_ode.cdat
    role: reference
  - name: reference/faeder2003_fig3a_receptor_aggregation_digitized.csv
    role: reference
    description: >
      Fig. 3a model curve, receptors in aggregates (% of receptors), digitized.
  - name: reference/faeder2003_fig3b_receptor_phosphorylation_digitized.csv
    role: reference
    description: >
      Fig. 3b model curves, receptors with gamma / beta ITAM phosphorylated
      (% of receptors), digitized; no samples within 17 px of a data point's
      error bar, so none before about 10 min.
  - name: reference/faeder2003_fig3c_lyn_redistribution_digitized.csv
    role: reference
    description: >
      Fig. 3c model curves, Lyn free / weakly associated / SH2-bound (% of
      receptor number), digitized from 8 min on; the overlapping free and
      weakly associated strokes are read by their edges (read = edge).
  - name: reference/faeder2003_fig3d_syk_phosphorylation_digitized.csv
    role: reference
    description: >
      Fig. 3d model curves, Syk phosphorylated by Lyn or Syk (total), by Syk
      (auto, one sample per isolated dash) and by Lyn (one per isolated dot),
      % of receptor number, digitized.
  - name: reference/early_fceri_signaling_faeder2003_fyn.net
    role: reference
  - name: reference/early_fceri_signaling_faeder2003_fyn_ode.net
    role: reference
  - name: reference/early_fceri_signaling_faeder2003_fyn_ode.gdat
    role: reference
  - name: reference/early_fceri_signaling_faeder2003_fyn_ode.cdat
    role: reference
