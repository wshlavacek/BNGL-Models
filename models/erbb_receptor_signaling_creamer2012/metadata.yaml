# metadata.yaml — erbb_receptor_signaling_creamer2012
id: erbb_receptor_signaling_creamer2012
created: 2026-07-23

point_of_contact:
  name: William S. Hlavacek
  email: bill.hlavacek@gmail.com
  orcid: 0000-0003-4383-8711
  github: wshlavacek

source:
  tags: [literature, originally_rule_based, network_free, ai_assisted]
  description: >
    Large rule-based model for ERBB-family (EGFR/ErbB2/ErbB3/ErbB4) receptor
    signaling of Creamer et al. (2012), BMC Systems Biology 6:107
    (doi:10.1186/1752-0509-6-107). The model body (parameters, molecule types,
    seed species, reaction rules and observables) is the published Supplementary
    File 1 (1752-0509-6-107-S1.bngl, identical to the model-guide copy
    ErbB_model.bngl except for trailing whitespace and a "written by Matt Creamer"
    header line), transcribed with the authors' inline rule numbers, section
    headers and per-observable comments preserved. 19 molecule types carry
    explicitly tracked S/T/Y phosphosites; the model resolves site-specific
    phosphorylation kinetics for 55 individual residues plus ERK and Akt
    activation. The reaction network is far too large to enumerate (>10^100
    reachable species), so the model is simulated NETWORK-FREE with NFsim; the
    published file ends with writeXML() only and that protocol is encoded natively
    in the begin actions block. Two value-preserving edits make the published model
    runnable under current BioNetGen/NFsim and reproduce the paper's subvolume
    simulation: (1) 33 detailed-balance parameters that the file defines as chained
    expressions are folded to numeric literals (BioNetGen exports them as XML
    <Function> elements, which NFsim >=1.14 cannot evaluate when functions
    reference functions); each folded literal keeps its original expression as a
    comment. (2) A house-style subvolume factor f implements the paper's
    compartment-size scaling (Methods used 0.2): copy numbers x f, bimolecular
    association rates / f. f=1 recovers the published full-cell model exactly
    (all 625 rule rate constants and 19 seed amounts, checked against the
    publisher's file through BioNetGen's XML export), and at any f every one of
    the 126 bimolecular rules scales as 1/f while none of the 499 unimolecular
    rules changes. Until 2026-11 ten association constants (Grb2kp1-4, EGFR
    pY1068/1114/1148/1173 + Grb2; Gab1kp156-161, ERK2 + six Gab1 S/T sites)
    were left undivided, slowing those reactions 50-fold at f=0.02: the MAPK
    cascade's Fig. 4 response was cut short and the Gab1 S/T sites barely
    phosphorylated. The committed f stays 0.02 (the paper's 0.2 is ten times
    the particles, about 1e6, and hours per run); Fig. 4 is checked at f=0.02,
    with the scatter of the paper's single f=0.2 run scaled from the f=0.02
    ensemble.

files:
  - name: erbb_receptor_signaling_creamer2012.bngl
    role: primary
    description: >
      Rule-based, network-free (NFsim) model of EGF/HRG-driven ERBB receptor
      signaling: four receptors bind ligand, homo-/hetero-dimerize,
      cross-phosphorylate, internalize/recycle, and recruit Shc/Grb2/Sos1/Gab1 to
      activate KRas -> Raf1 -> MEK1 -> ERK2 (with ERK2 negative feedback) and
      PI3K -> PIP3 -> PDK1 -> Akt1. Copy numbers are scaled by the reserved
      subvolume factor f (default 0.02, about 96,000 particles; f=1 = published
      full-cell model). The active
      protocol equilibrates the basal state with ligand binding off, turns ligand
      binding on (EGF and HRG at 5 nM each), then follows the 180 min response,
      reporting phosphorylation time courses for 55 S/T/Y residues plus ERK and Akt
      (Fig. 4).
    documentation_target: standard
    scale: minutes
    min_bionetgen_version: "2.9.3"
  - name: run_creamer2012.py
    role: verification
    scale: hours
    description: >
      Self-contained driver; BioNetGen is located through $BNG2_PL or $BNGPATH
      (or the bionetgen CLI) and every run uses a temporary directory inside
      this folder. `fig4_ensemble [N] [f] [workers] [cache]` runs the committed
      file with its own two-phase actions block, unchanged except for pinned
      seeds (1000+r equilibration, 5000+r response) and a 10-s output grid (the
      Fig. 4 bitmap's own column spacing), N=144 times in parallel under
      standard BioNetGen NFsim, and caches per-run features to
      reference/fig4_ensemble_f0.02.npz; `fig4_negctl` does the same with the
      pre-fix rules (the ten constants above undivided by f). `data` is level
      2: per-site F_hi (fraction of the 180 min above 0.14 of the site's
      maximum, i.e. red vs green in Fig. 4) of the digitized published run
      against the ensemble, over the sites whose mean peak is >= 20 molecules,
      asserted at rms z <= sqrt(chi2_0.999(k)/k). `reference [save]` runs the
      committed file verbatim (and regenerates reference/*.gdat); `xml`
      regenerates reference/<stem>.xml. `agreement` and `flags` are the older
      three-engine cross-check and -bscb/-utl determination (bngsim arms,
      reduced single-phase protocol at f=0.002); their caches predate the
      fix. `plot` builds the PNG from committed artifacts only.
  - name: digitize_creamer2012.py
    role: verification
    description: >
      Regenerates reference/creamer2012_fig4_digitized.csv byte for byte from
      the authors' original Fig. 4 file (ESM 12918_2012_954_MOESM6_ESM.pdf, not
      committed; dev/papers/creamer2012/). Reads the embedded heat-map JPEG at
      its native 2432 x 1115 px; measures its cell grid from the bitmap itself
      (colour jumps only every second pixel column: 1081 columns = 0-180 min at
      10 s; 55 rows of 20 px) and asserts every site label sits on its row;
      maps colour to value by projection onto the green-black (0-0.14) and
      black-red (0.14-1) segments, with stops measured on the map. The
      hand-placed time labels are offset from the grid (0 at 2.2 min, 180 at
      174.2 min) and are not used.
  - name: verify_creamer2012.ipynb
    role: verification
    scale: minutes
    description: >
      Notebook of asserted checks, all through BioNetGen's NFsim and none
      through bngsim: the committed file's rule rate constants equal the
      publisher's file at f=1 and scale uniformly with f (BioNetGen XML
      export); the file's own protocol runs verbatim (transient receptor
      sites, sustained Akt, nothing phosphorylated before ligand); one cached
      replicate is replayed and must match exactly; level 2 against the
      re-digitized Fig. 4 (144 runs at f=0.02; per-site F_hi z with a stated
      error budget, Bonferroni and chi-square bounds); and the pre-fix rules
      rejected by the same test. The three-engine and -bscb/-utl caches are
      described but predate the fix.
  - name: verify_creamer2012.png
    role: figure
    description: >
      Verification figure: the committed reference run (180 min response) and
      its flat ligand-off equilibration; level 2 as a parity plot of per-site
      F_hi (published Fig. 4 vs the 144-run ensemble, with the pre-fix rules
      overlaid) and per-site z bars for both; the digitized Fig. 4, one
      simulated run and the ensemble mean as heat maps on the same colour map;
      numbers and verdicts on the figure.
  - name: reference/erbb_receptor_signaling_creamer2012.xml
    role: reference
    description: >
      BioNetGen writeXML() export of the network-free model at the shipped
      nominals (subvolume f=0.02, ligand binding off at lig=0 — the state the
      actions block equilibrates before setting lig=1), the input consumed by
      the bngsim NFsim / RuleMonkey engines. The reduced f=0.002 XMLs the
      three-engine cross-check runs on are baked per run in a temp dir by
      run_creamer2012.py and are not committed.
  - name: reference/erbb_receptor_signaling_creamer2012_equil.gdat
    role: reference
    description: >
      Equilibration observables (ligand off; flat basal state), one unseeded
      run of the committed file under BNG NFsim, f=0.02.
  - name: reference/erbb_receptor_signaling_creamer2012_erbb.gdat
    role: reference
    description: >
      180 min stimulation-response observables of the same run (published
      protocol).
  - name: reference/agreement.npz
    role: reference
    description: >
      Cached three-engine ensembles (per-seed observable trajectories) for the
      reduced-subvolume network-free agreement cross-check. Computed on the
      pre-fix rules (the ten association constants undivided by f); it compares
      engines on that rule set and has not been regenerated.
  - name: reference/flags.npz
    role: reference
    description: >
      Cached NFsim ensembles for default / -bscb / -bscb -utl vs exact
      RuleMonkey, with the verdict that the molecularity flags are no-ops for
      this model. Computed on the pre-fix rules, like agreement.npz.
  - name: reference/fig4_ensemble_f0.02.npz
    role: reference
    description: >
      144 runs of the published protocol, committed file, f=0.02, BioNetGen
      2.9.3 NFsim (-cb from BNG2.pl, no -bscb, default -utl, gml 2^31-1), seeds
      1000+r / 5000+r, 10-s output: per-run, per-site F_hi, F_half, auc and
      t_peak of the max-normalized course, per-run maxima, per-site sums and
      sums of squares of the counts (ensemble mean and s.e.m.), and replicate
      1's 55 x 1081 counts.
  - name: reference/fig4_ensemble_f0.02_negctl.npz
    role: reference
    description: >
      The same for the negative control: 72 runs of the pre-fix rules.
  - name: reference/creamer2012_fig4_digitized.csv
    role: reference
    description: >
      Fig. 4 as published (one NFsim run at compartment scale 0.2): 55 sites
      in figure order x 1081 columns (0-180 min every 10 s, the heat map's own
      cell grid), per-site max-normalized, written by digitize_creamer2012.py
      from the authors' original figure file; JPEG noise about 0.005 (green
      side) to 0.03 (red side) in value.
