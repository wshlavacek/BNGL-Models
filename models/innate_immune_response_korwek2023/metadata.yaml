  # Reported simulation data and experimental data digitized from the source figures
  - name: reference/korwek2023_figS4_digitized.csv
    role: reference
    description: >
      Published model trajectories and quantified blots from figs. S4A to S4D - 11
      observables x 10 lanes for the IFN-beta / IFN-beta + poly(I:C) protocol, the same
      observables x 6 lanes for the poly(I:C)-only protocol, and the OAS3 panels. Each series
      carries flags marking markers that sit on the axis floor or are clipped by the top of
      the axis. Regenerate with digitize_korwek2023.py.
  - name: reference/korwek2023_figS12_digitized.csv
    role: reference
    description: >
      Published model trajectories and quantified blots from figs. S12A and S12B - nuclear
      NF-kB over 9 lanes, and p-IKK, IkBa and A20 over the wild-type fine and long time
      courses and the A20 KO time course. Same axis flags. Regenerate with
      digitize_korwek2023.py.
