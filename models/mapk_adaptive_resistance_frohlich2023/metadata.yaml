# metadata.yaml — mapk_adaptive_resistance_frohlich2023
id: mapk_adaptive_resistance_frohlich2023
created: 2026-08-04

point_of_contact:
  name: William S. Hlavacek
  email: hlavacek@lanl.gov
  orcid: 0000-0003-4383-8711
  github: wshlavacek

source:
  tags: [literature, originally_rule_based, translation]
  description: >
    Condition-specific translation of the MARM2.0 PySB energy-pattern model
    distributed with Fröhlich et al. (2023), Molecular Systems Biology
    19:e10988. The primary file uses the best-ranked calibrated parameter set
    and the source-model state after 24 h adaptation to 1 uM vemurafenib, then
    applies the 100 ng/mL EGF pulse from Fig. 2A. The authors' release is
    github.com/labsyspharm/marm2-supplement at 7e977899 (tag `resubmission`,
    Zenodo doi:10.5281/zenodo.6979792), also published as Code EV1 of the
    CC BY 4.0 article; the model definition and parameter table are vendored
    byte-identical under reference/, pinned with licence and attribution in
    reference/frohlich2023_marm2_upstream.json. run_frohlich2023.py finds the
    network, parameters and rate laws identical to that release, and finds
    that the seed populations are not the authors' Fig. 2A adaptation: they
    are the model's raw initial values integrated 24 h at 1 uM vemurafenib
    (seeds within 3.1e-7 of that state), whereas the authors' pipeline
    pre-equilibrates to steady state at 1 uM vemurafenib (seeds up to 2.3e-2
    from it; pERK_IF_obs up to 1.1e-2 relative, 0.0034 IF units, over the
    2 h pulse). The primary is left as it is; the variant
    mapk_adaptive_resistance_frohlich2023_preeq.bngl is the same model
    seeded with the authors' steady state, and reproduces the authors' own
    simulation under their protocol (see its entry and the comparison JSON).

files:
  - name: mapk_adaptive_resistance_frohlich2023.bngl
    role: primary
    description: >
      MARM2.0 EGFR-RAS-RAF-MEK-ERK energy-pattern model with transcriptional
      and post-translational feedback. Its active ODE protocol reproduces the
      two-hour EGF-induced pERK pulse after vemurafenib adaptation.
    documentation_target: standard
    scale: minutes
    min_bionetgen_version: "2.9.3"
  - name: mapk_adaptive_resistance_frohlich2023_preeq.bngl
    role: variant
    description: >
      The primary seeded the way the authors seed Fig. 2A: with their model's
      steady state at 1 uM vemurafenib and no EGF (AMICI pre-equilibration in
      their pipeline), then the same 100 ng/mL EGF step and 0-2 h ODE
      protocol. Model body byte-identical to the primary, with the same 333
      species seeded; the 331 unclamped amounts are the authors' steady state
      to 13 significant digits, from
      reference/frohlich2023_marm2_adapted_state.csv (330 of them differ from
      the primary's; free RAS-GDP agrees to all 13 digits). Generated by generator/build_frohlich2023_preeq.py; verified by
      run_frohlich2023.py under the authors' protocol: parameters 1.3e-13,
      network identical (1,612 species, 17,516 reactions), dy/dt 1.1e-13 of
      the gross flux, seeds 4.6e-13 of the authors' state; the independent
      SciPy integration of its network against the authors' trajectory
      2.7e-11 (pERK_IF_obs), 5.3e-12 (pMEK_IF_obs), 4.6e-11 (30 observables),
      9.4e-7 (species, of peak); the committed run_network .gdat 1.8e-6
      against both (all tolerances 1e-5). Against the primary its seeds
      differ by up to 2.3e-2 and its pERK_IF_obs by up to 1.1e-2. Because
      the 1,279 species below the 1e-15 uM seed floor start at zero, the
      seeds themselves do not pass AMICI's steady-state test (WRMS of dy/dt
      27, against 1.5e-5 for the authors' full state; zeroing the same
      species in the authors' state gives the same 27, so the 13-digit
      rounding plays no part); its whole effect is inside the trajectory
      agreement above.
    documentation_target: standard
    scale: minutes
    min_bionetgen_version: "2.9.3"
  - name: generator/
    role: tooling
    description: >
      build_frohlich2023_preeq.py writes
      mapk_adaptive_resistance_frohlich2023_preeq.bngl from the pinned primary
      (whose 97 calibrated values it checks against row 0 of the authors'
      table) and the steady state in
      reference/frohlich2023_marm2_adapted_state.csv, refusing to run on any
      sha256 mismatch; it reproduces the committed file byte for byte
      (`--check`; guarded by tests/test_frohlich2023_preeq_generator.py).
  - name: verify_frohlich2023.ipynb
    role: verification
    description: >
      Reruns BioNetGen, independently parses and integrates the generated
      1,612-species network with SciPy/BDF, compares the result with the
      authors' supplementary source-model simulation, and overlays the
      tabular Fig. 2A measurements.
  - name: verify_frohlich2023.png
    role: figure
    description: >
      Overlay of curated BioNetGen, independent SciPy, authors' source-model,
      and Fig. 2A measurement trajectories.
  - name: verify_frohlich2023_preeq.png
    role: figure
    description: >
      Drawn by run_frohlich2023.py: the _preeq file's run_network pERK_IF_obs
      against the independent SciPy integration (level 1) and the authors'
      own model under their protocol (level 2), with residuals; parity of all
      32 outputs against the authors; its seeds against the authors' steady
      state, with residuals; and the Fig. 2A measurements (descriptive).
  - name: reference/frohlich2023_fig2a_vemurafenib1um_source_model.csv
    role: reference
    description: >
      Read by the notebook as the authors' source-model trajectory, but no
      committed code generates it, and it is bit-identical (13 significant
      digits, all 201 points) to pERK_IF_obs in the curated BioNetGen .gdat,
      so its agreement is not evidence. The authors'-model trajectories that
      run_frohlich2023.py does generate are the two frohlich2023_marm2_fig2a_*
      files below.
  - name: reference/frohlich2023_fig2a_vemurafenib1um_egf100ngml_measurements.csv
    role: reference
    description: >
      Publisher-supplied processed experimental pERK means and standard
      deviations for the Fig. 2A trajectory, extracted from rows 0-9 of the
      supplementary processed_EGF_EGFR_MEKi_PRAFi_RAFi.csv file.
  - name: reference/mapk_adaptive_resistance_frohlich2023.net
    role: reference
    description: Generated network with 1,612 species and 17,516 reactions.
  - name: reference/mapk_adaptive_resistance_frohlich2023_ode.net
    role: reference
  - name: reference/mapk_adaptive_resistance_frohlich2023_ode.gdat
    role: reference
  - name: reference/mapk_adaptive_resistance_frohlich2023_ode.cdat
    role: reference
  # Reference output for mapk_adaptive_resistance_frohlich2023_preeq.bngl (BioNetGen 2.9.3; the
  # stock run_network binary, launched under a glibc 2.34 loader on a glibc 2.28 host)
  - name: reference/mapk_adaptive_resistance_frohlich2023_preeq.net
    role: reference
    description: >
      Generated network of the _preeq file: 1,612 species and 17,516
      reactions, identical to the primary's .net except for 330 seed
      amounts.
  - name: reference/mapk_adaptive_resistance_frohlich2023_preeq_ode.net
    role: reference
  - name: reference/mapk_adaptive_resistance_frohlich2023_preeq_ode.gdat
    role: reference
    description: >
      The _preeq protocol: 30 observables and the printed functions,
      including pERK_IF_obs and pMEK_IF_obs, t = 0..2 h, 201 points.
  - name: reference/mapk_adaptive_resistance_frohlich2023_preeq_ode.cdat
    role: reference
    description: All 1,612 species of the same run.
  - name: independent_frohlich2023.py
    role: verification
    description: >
      The curated arm of run_frohlich2023.py: the notebook's level-1 .net
      integrator factored out unchanged in behaviour, plus an analytic sparse
      Jacobian. The notebook still carries its own inline copy.
  - name: run_frohlich2023.py
    role: verification
    scale: minutes
    description: >
      Compares the pinned .bngl and its _preeq variant with the authors' own
      MARM2.0 release, never using bngsim. A driver script rather than a
      notebook cell because it needs PySB, Cython and a C compiler (`uv sync
      --group marm2`), which the notebook environment does not; about 6
      minutes on one core (5 min 46 s on a Xeon E7-8880 v3). It builds
      the authors' PySB model at calibrated row 0 as the Fig. 2A (EGF_RAFi)
      instance, re-implementing the two AMICI-bound steps of their pipeline it
      needs, and checks parameters, a species bijection with identical
      reactions, and dy/dt and two independently derived Jacobians at six
      states; then, for two adaptation protocols (the authors' steady state,
      and the 24 h from initial values that the .bngl seeds encode), the seeds
      and the 0-2 h trajectories of pERK_IF_obs, pMEK_IF_obs, all observables
      and all species. The primary passes the model checks and the 24 h
      protocol and misses the authors' protocol, which is recorded, not
      asserted. The _preeq file is then checked under the authors' protocol
      with the same tolerances: parameters, its own BNG2.pl network against
      the authors', dy/dt, seeds, the independent SciPy integration of its
      network against the authors' trajectory, and its committed run_network
      .gdat against both; it draws verify_frohlich2023_preeq.png. Exits 0
      only if the primary is model-equivalent and the _preeq file verifies.
  - name: reference/frohlich2023_marm2_RTKERK__pRAF.py
    role: reference
    description: >
      The authors' flattened PySB model, variant pRAF (MARM/pysb_flat/
      RTKERK__pRAF.py at labsyspharm/marm2-supplement 7e97789), byte-identical;
      CC BY 4.0 via Code EV1 of the article.
  - name: reference/frohlich2023_marm2_RTKERK_pRAF_EGF_EGFR_MEKi_PRAFi_RAFi.csv
    role: reference
    description: >
      The authors' 50 best calibrated parameter sets (MARM/parameters/ at the
      same commit), byte-identical; row 0, the best-ranked, is the one used.
  - name: reference/frohlich2023_marm2_upstream.json
    role: reference
    description: >
      Provenance pin for the two vendored files (repository, commit, upstream
      paths, sha256, the Code EV1 checksum, licence and attribution) and the
      Fig. 2A protocol columns of the authors' processed data table.
  - name: reference/frohlich2023_marm2_fig2a_authors_protocol.csv
    role: reference
    description: >
      The authors' model under their own Fig. 2A protocol (steady state at
      1 uM vemurafenib without EGF, then 100 ng/mL EGF): every output
      expression and observable on the 0-2 h grid. Written by run_frohlich2023.py.
  - name: reference/frohlich2023_marm2_fig2a_24h_protocol.csv
    role: reference
    description: >
      The same outputs after 24 h at 1 uM vemurafenib from the model's initial
      values, the adaptation the .bngl seeds encode. Written by run_frohlich2023.py.
  - name: reference/frohlich2023_marm2_adapted_state.csv
    role: reference
    description: >
      Per .net species, the primary's seed beside the authors' state at t = 0
      under each protocol (free EGF re-initialized at 100 ng/mL), the authors'
      values at full double precision. Written by run_frohlich2023.py; its
      authors_steady_state_uM column is what
      generator/build_frohlich2023_preeq.py seeds the _preeq file with (sha256
      pinned there).
  - name: reference/frohlich2023_marm2_comparison.json
    role: reference
    description: >
      Every metric, tolerance, reason and verdict of run_frohlich2023.py, for
      the primary and (under preeq_variant) the _preeq file, with the sha256
      of each .bngl it checked, the pinned authors' files, the protocols and
      the software versions.
