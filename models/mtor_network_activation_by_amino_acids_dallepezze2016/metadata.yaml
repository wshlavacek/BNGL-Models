source:
  tags: [literature, adapted_from_sbml, biomodels_database, adapted_from_ode, ai_assisted]
  description: >
    Dalle Pezze P et al. (2016), Nature Communications 7:13254,
    doi:10.1038/ncomms13254. Transcribed from BioModels BIOMD0000000640 (curated,
    CC0), the deposit of the paper's Supplementary Software 3 — the best-fit
    "Model 3" with four amino-acid inputs and the extended p70-S6K module, which
    is the model drawn in Fig. 2a and used for every simulation in Figs 2b-d, 3a,
    4a, 5c and 7a. The article PDF alone is not sufficient to build the model:
    the complete ODE system and all 48 fitted rate constants live in
    Supplementary Tables 1-4 and Supplementary Software 1-3, none of which are
    in the article file. Three points are worth recording about the transcription.
    (1) The 12 `_first`/`_second` rate pairs of Akt, p70-S6K and PRAS40 are NOT
    equal in the published fit — five differ by more than an order of magnitude,
    and collapsing them changes ten of the twelve observables — so each context
    carries its own rule and its own constant. (2) Wortmannin is not a species in
    the deposited model; the string does not occur in it. The Fig. 2d condition
    is a 10% PI3K pool, which is how the Methods say inhibition was simulated and
    what the Fig. 1d caption calls "residual activity 10%". (3) The model is
    dimensionless: amounts are arbitrary relative units with no volume anywhere in
    the paper, so it is ODE-only and carries no NA, V_ref or compartments block.
    The two sibling models from the same paper (BioModels MODEL1705030000 "Model 1",
    single amino-acid input, and MODEL1705030001 "Model 2", four inputs with the
    simple p70-S6K module) are separately fitted parameter sets that answer the
    paper's model-selection question rather than variants of this one; they are not
    curated here, and adding them is a well-defined follow-up.

files:
  - name: mtor_network_activation_by_amino_acids_dallepezze2016.bngl
    role: primary
    description: >
      Amino-acid readdition without insulin — the Fig. 2c calibration condition —
      plus the four single-node perturbation scans of Figs 3a, 4a, 5c and 7a.
    documentation_target: comprehensive
    min_bionetgen_version: "2.9.3"
    scale: trivial          # 48 reactions; 0.8 s for the run plus four 10-point scans
  - name: mtor_network_activation_by_amino_acids_dallepezze2016_insulin.bngl
    role: variant
    description: >
      Amino acids plus insulin (Fig. 2b). Differs from the primary file by one seed
      amount, Ins_0 = 1, which switches on the whole insulin arm and a twelfth
      readout, IR-pY1146.
    documentation_target: comprehensive
    min_bionetgen_version: "2.9.3"
    scale: trivial
  - name: mtor_network_activation_by_amino_acids_dallepezze2016_wortmannin.bngl
    role: variant
    description: >
      Amino acids under PI3K inhibition (Fig. 2d). Differs from the primary file by
      one parameter, PI3K_level = 0.1. Numerically identical to the 10% point of the
      primary file's Fig. 3a PI3K scan, which the verification notebook checks.
    documentation_target: comprehensive
    min_bionetgen_version: "2.9.3"
    scale: trivial

  - name: verify_dallepezze2016.ipynb
    role: verification
    description: >
      Both verification levels, the reference-output regression, and the
      variant-versus-scan cross-check. Committed with its outputs.
    scale: trivial
  - name: verify_dallepezze2016.png
    role: figure
  - name: independent_dallepezze2016.py
    role: verification
    description: >
      Two level-1 arms. A hand-written SciPy system of the 31 states and 48
      reactions, which tests that the BNGL rules expand to the intended network;
      and a mechanical integration of BIOMD0000000640 itself through libSBML,
      which is the only arm that tests whether the deposit was read correctly.
      The second needs the SBML under dev/papers/ and says where to get it when
      it is absent.
  - name: digitize_dallepezze2016.py
    role: verification
    description: >
      Recovers all 25 simulated curves of Fig. 2b, 2c and 2d from a 600 dpi render
      of page 5. The y axis is calibrated on each panel's own tick marks and the x
      axis on the printed tick labels; the two input panels, whose values the model
      fixes, are used as calibration landmarks and gate the run.

