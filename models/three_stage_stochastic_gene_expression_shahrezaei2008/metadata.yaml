source:
  tags:
    - literature
    - adapted_from_bngl
    - originally_rule_based
    - reformulation
    - ai_assisted
  description: >
    Curated from Shahrezaei and Swain (2008), PNAS 105:17256-17261,
    the 2009 correction to Eq. 13, the supporting appendix, and the
    supplied BioNetGen test-suite gene_expr_3stage.bngl model. The
    primary model replaces auxiliary Src and Null species with direct
    catalytic synthesis and degradation channels that implement the
    paper's chemical master equation. Its seeded SSA protocol
    reproduces the bimodal stationary protein distribution in Fig. 3D.

