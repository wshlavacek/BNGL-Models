# metadata.yaml — tlbr_solution_macken1982
id: tlbr_solution_macken1982
created: 2026-03-26

point_of_contact:
  name: William S. Hlavacek
  email: bill.hlavacek@gmail.com
  orcid: 0000-0003-4383-8711
  github: wshlavacek

source:
  tags: [literature, new_model, ai_assisted]
  description: >
    Built from the kinetic and equilibrium theory in Macken and
    Perelson (1982), J Math Biol 14:365-370. The BNGL model
    implements trivalent ligand-bivalent receptor crosslinking
    in solution without intramolecular (cyclic) bonds, validated
    against the paper's ODE kinetics (Eq. 11), closed-form
    equilibrium predictions (Eqs. 13, 17), and branching
    process aggregate size distribution (Theorem 1, Eq. 21).

files:
  - name: tlbr_solution_macken1982.bngl
    role: primary
    description: >
      Trivalent ligand (f=3) binding bivalent receptor (g=2) in
      solution with three rules: capture, crosslink, dissociation.
      NFsim with -bscb flag (no intra-complex rings).
    documentation_target: standard
    scale: minutes
    min_bionetgen_version: "2.9.3"
  - name: verify_macken1982.ipynb
    role: verification
    scale: minutes
    description: >
      Compares NFsim, run by stock BioNetGen BNG2.pl with the file's own
      action (500 s, -bscb; only NL and the seed substituted; 200 seeds per
      dose, every trajectory its own seed), against Macken and Perelson
      (1982) kinetic ODEs (Eq. 11), branching process aggregate
      distributions (Theorem 1) and Eq. 21 equilibrium at three ligand
      doses, and asserts, with each tolerance stated in the notebook: the
      ODE at equilibrium reproduces Eqs. 13/17/21 (1e-6 relative); every
      dose is below the gel point (Eq. 18); bonds, free ligand and the four
      small-aggregate counts at every sampled time (pooled z, max |z| under a
      family-wise 0.1 % bound and fraction |z| < 3 >= 0.99); the same over
      the final 60 s per dose and observable, and combined over doses; and
      the final-window means against Eq. 21 within the SE term plus the
      ODE's own distance from equilibrium at 500 s. Set NF_WORKERS to run
      trajectories in parallel (default 2).
  - name: verify_macken1982.png
    role: figure
    description: Bond kinetics comparison
  - name: verify_macken1982_aggregates.png
    role: figure
    description: Aggregate distribution kinetics comparison
  - name: reference/tlbr_solution_macken1982.xml
    role: reference
    description: >
      BioNetGen writeXML() export of the network-free model at the shipped
      nominals (NL=4200, NR=300, kappa_ST=0.5, f=1), the input consumed by
      NFsim and by any RuleMonkey cross-check.
  - name: reference/tlbr_solution_macken1982_nfr.gdat
    role: reference
    description: >
      NFsim reference output at default parameterization
      (NL=4200, NR=300, kappa_ST=0.5).
