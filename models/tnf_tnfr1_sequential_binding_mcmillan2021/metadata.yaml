# metadata.yaml — tnf_tnfr1_sequential_binding_mcmillan2021
id: tnf_tnfr1_sequential_binding_mcmillan2021
created: 2026-08-03

point_of_contact:
  name: William S. Hlavacek
  email: hlavacek@lanl.gov
  orcid: 0000-0003-4383-8711
  github: wshlavacek

source:
  tags: [literature, originally_rule_based, adapted_from_bngl, ai_assisted]
  description: >
    Reconstructed from the BioNetGen model and SciPy fitting script distributed
    as Supplementary Software 1 with McMillan et al. (2021), Nature
    Communications 12:582, DOI 10.1038/s41467-020-20828-3. The seven-dose
    occupancy fractions are copied from the publisher's official Source Data
    workbook, sheet Fig 1b; no curve digitization was used.

files:
  - name: tnf_tnfr1_sequential_binding_mcmillan2021.bngl
    role: primary
    description: >
      Apo-TNF sequential binding model with the published 0.01, 0.02, and
      0.22 nM microscopic dissociation constants and an active Figure 1b
      receptor-titration protocol.
    documentation_target: standard
    min_bionetgen_version: "2.9.3"
  - name: tnf_tnfr1_sequential_binding_mcmillan2021_ucb0595.bngl
    role: variant
    description: >
      UCB-0595-bound TNF variant with the published 0.04, 0.19, and 9612 nM
      microscopic dissociation constants and the matching Figure 1b protocol.
    documentation_target: standard
    min_bionetgen_version: "2.9.3"
  - name: verify_mcmillan2021.ipynb
    role: verification
    description: >
      Runs both BNGL files in temporary directories, independently integrates
      the four-state occupancy equations in SciPy, verifies agreement to
      1.4e-9 or better, and compares the published parameterizations with the
      official Figure 1b occupancy fractions.
  - name: verify_mcmillan2021.png
    role: figure
    description: >
      Overlay of BioNetGen trajectories, independent SciPy solutions, and the
      official Figure 1b source data for apo and UCB-0595-bound TNF.
