# JAK-STAT Figure 2B fit (Cheemalavagu et al. 2024) -- ODE, six cytokine conditions.
#
# Source: Cheemalavagu N et al. Cell Systems 2024;15:37-48.e4.
# DOI: 10.1016/j.cels.2023.12.002. Fit target: Figure 2B and STAR Methods.
# Data were extracted from the authors' pooled pSTAT1/pSTAT3 workbooks at
# https://github.com/ncheemalavagu/STAT_models (commit 28874f0801077f479526157300f70fdccb672013).
#
# The paper normalized each proposed model to IL-6 10 ng/mL at 20 min. To remain in the
# PEtab-v2-exportable subset, this job expresses those two channel normalizers as fitted
# measurement-scale parameters. The 46 biological parameters match the paper; the two scale
# parameters are nuisance parameters. See README.md and VALIDATION.md.
#
# Run from this folder with BNGPATH set: pybnf -c jak_stat_fig2b.conf

output_dir = output
edition = 2
bngl_backend = bngsim
model: jak_stat_fig2b.bngl

#######################
### General Options ###
#######################
delete_old_files = 1
verbosity = 1
wall_time_sim = 120
max_failed_simulations = 10000

##################
### Conditions ###
##################
condition: il6_1, perturbations: L1_0 = 1, L2_0 = 0
condition: il6_10, perturbations: L1_0 = 10, L2_0 = 0
condition: il10_1, perturbations: L1_0 = 0, L2_0 = 1
condition: il10_10, perturbations: L1_0 = 0, L2_0 = 10
condition: il6_1_il10_1, perturbations: L1_0 = 1, L2_0 = 1
condition: il6_10_il10_10, perturbations: L1_0 = 10, L2_0 = 10

###################
### Experiments ###
###################
experiment: il6_1, condition: il6_1, data: il6_1.exp
experiment: il6_10, condition: il6_10, data: il6_10.exp
experiment: il10_1, condition: il10_1, data: il10_1.exp
experiment: il10_10, condition: il10_10, data: il10_10.exp
experiment: il6_1_il10_1, condition: il6_1_il10_1, data: il6_1_il10_1.exp
experiment: il6_10_il10_10, condition: il6_10_il10_10, data: il6_10_il10_10.exp

#######################
### Fitting Options ###
#######################
job_type = de
objective = chi_sq
population_size = 96
max_iterations = 1000
refine = 1

##################
### Parameters ###
##################
# Bounds span the authors' 2,067 retained ensemble members, expanded tenfold at each end.
