# Imported from a PEtab v2 problem by pybnf.petab.import_job (#407).
# The PEtab *problem* (parameters/priors, observables/noise, measurements,
# conditions) is recovered exactly and round-trips through a re-export. The
# run-recipe below (job_type + algorithm settings, the per-experiment method:,
# and output/verbosity) is SUPPLIED, not recovered: PEtab is a problem spec with
# no home for the method, so it is not part of the round-trip identity.
#
# Blasi et al. (2016), Cell Systems 2:49-58 -- combinatorial acetylation of the
# histone H4 tail. The 16 species are the 16 acetylation motifs of lysines
# K5/K8/K12/K16 and the 32 reactions are the edges of that 4-cube. All 252
# measurements are STATIONARY abundances under the single condition `control`,
# so every row is at `time = inf`: no time axis and no dose axis. Fitting them
# needs lanl/PyBNF#509 (natural-log noise, ADR-0084) to import and
# lanl/PyBNF#521 (steady state, ADR-0086) to load and run.
#
# The importer also emits `noise_model x_k5k16 = lnnormal, sigma = read_exp_file
# _SD`. It is dead: `observable_k5k16` is declared in the PEtab observables
# table but carries zero measurement rows (the K5K16 motif is below the LC-MS
# quantification limit), so no `.exp` file has an `x_k5k16` column and the line
# is never consulted. It is dropped here so the conf does not imply a 16th
# fitted observable.

job_type = gntr
population_size = 20
max_iterations = 500
wall_time_sim = 10
verbosity = 1
sbml_backend = bngsim
random_seed = 1
output_dir = output

edition = 2

model: model_Blasi_CellSystems2016.xml
objective = chi_sq
noise_model x_0ac = lnnormal, sigma = fit sigma
noise_model x_4ac = lnnormal, sigma = fit sigma
noise_model x_k12 = lnnormal, sigma = fit sigma
noise_model x_k12k16 = lnnormal, sigma = fit sigma
noise_model x_k16 = lnnormal, sigma = fit sigma
noise_model x_k5 = lnnormal, sigma = fit sigma
noise_model x_k5k12 = lnnormal, sigma = fit sigma
noise_model x_k5k12k16 = lnnormal, sigma = fit sigma
noise_model x_k5k8 = lnnormal, sigma = fit sigma
noise_model x_k5k8k12 = lnnormal, sigma = fit sigma
noise_model x_k5k8k16 = lnnormal, sigma = fit sigma
noise_model x_k8 = lnnormal, sigma = fit sigma
noise_model x_k8k12 = lnnormal, sigma = fit sigma
noise_model x_k8k12k16 = lnnormal, sigma = fit sigma
noise_model x_k8k16 = lnnormal, sigma = fit sigma

experiment: experiment1, method: ode, data: experiment1.exp, experiment1_rep2.exp, experiment1_rep3.exp, experiment1_rep4.exp, experiment1_rep5.exp, experiment1_rep6.exp, experiment1_rep7.exp, experiment1_rep8.exp, experiment1_rep9.exp, experiment1_rep10.exp, experiment1_rep11.exp, experiment1_rep12.exp, experiment1_rep13.exp, experiment1_rep14.exp, experiment1_rep15.exp, experiment1_rep16.exp, experiment1_rep17.exp, experiment1_rep18.exp

loguniform_var = a_basal 1e-12 1000
loguniform_var = a_k8 1e-12 1000
loguniform_var = a_k5_k5k12 1e-12 1000
loguniform_var = a_k12_k5k12 1e-12 1000
loguniform_var = a_k16_k12k16 1e-12 1000
loguniform_var = a_k5k12_k5k8k12 1e-12 1000
loguniform_var = a_k12k16_k8k12k16 1e-12 1000
loguniform_var = a_k8k12k16_4ac 1e-12 1000
loguniform_var = sigma 1e-12 1000
