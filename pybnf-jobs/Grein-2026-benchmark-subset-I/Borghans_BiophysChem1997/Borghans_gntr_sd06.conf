# Multi-start GNTR with bounded, nominal-centered initialization (one-decade SD).
job_type = gntr
population_size = 100
max_iterations = 500
parallel_count = 3
wall_time_sim = 10
verbosity = 1
sbml_backend = bngsim
random_seed = 25
output_dir = output_gntr_nominal_sd06

edition = 2
model: model_Borghans_BiophysChem1997.xml
noise_model = lognormal, sigma = fit sigma
observable: Ca, formula: Z_state*scale + offset
experiment: experiment1, method: ode, data: experiment1.exp
