# START POINT: the paper's parameter values (Borghans, Dupont & Goldbeter 1997, Fig. 8, as curated
# in BioModels BIOMD0000000044). A periodic BURSTING attractor: two spikes per burst, burst period
# 2.83. The paper never fitted these data, so scale and offset (not part of the paper's set) are
# profiled against the data and the initial values are the PEtab nominal ones; sigma is the
# profiled residual. Scores OG = 70.6 as it stands. See README, "What the fits are, dynamically".

# Imported from a PEtab v2 problem by pybnf.petab.import_job (#407); the problem block is the
# job's own (see Borghans_BiophysChem1997.conf). The recipe here is a gradient polish FROM the
# start point below: gntr evaluates the point first, so the first objective it reports is the
# point's own score, and it then descends. Set max_iterations = 0 to only score the point.

job_type = gntr
max_iterations = 200
gntr_max_iterations = 200
population_size = 1
wall_time_sim = 10
verbosity = 1
sbml_backend = bngsim
random_seed = 1
output_dir = output_start_paper_fig8

edition = 2
model: model_Borghans_BiophysChem1997.xml
noise_model = lognormal, sigma = fit sigma
observable: Ca, formula: Z_state*scale + offset
experiment: experiment1, method: ode, data: experiment1.exp
loguniform_var = K2 0.001 100000
loguniform_var = K_par 0.001 100000
loguniform_var = Ka 0.001 100000
loguniform_var = Kd 0.001 100000
loguniform_var = Kf 0.001 100000
loguniform_var = Kp 0.001 100000
loguniform_var = Ky 0.001 100000
loguniform_var = Kz 0.001 100000
loguniform_var = Vd 0.001 100000
loguniform_var = Vm2 0.001 100000
loguniform_var = Vm3 0.001 100000
loguniform_var = Vp 0.001 100000
loguniform_var = beta_par 0.001 100000
loguniform_var = epsilon_par 0.001 100000
uniform_var = init_A_state 0 1
uniform_var = init_Y_state 0 1
uniform_var = init_Z_state 0 1
loguniform_var = n_par 0.001 100000
loguniform_var = offset 0.001 100000
loguniform_var = scale 0.001 100000
loguniform_var = sigma 0.001 100000
loguniform_var = v0 0.001 100000
loguniform_var = v1 0.001 100000

start_point = K2 0.1
start_point = K_par 10
start_point = Ka 0.2
start_point = Kd 0.4
start_point = Kf 1
start_point = Kp 1
start_point = Ky 0.2
start_point = Kz 0.3
start_point = Vd 80
start_point = Vm2 6.5
start_point = Vm3 19.5
start_point = Vp 2.5
start_point = beta_par 0.5
start_point = epsilon_par 0.1
start_point = init_A_state 1
start_point = init_Y_state 0.999348084439
start_point = init_Z_state 0.0879205244255
start_point = n_par 4
start_point = offset 0.392906631043
start_point = scale 0.37939158916
start_point = sigma 0.124069162513
start_point = v0 2
start_point = v1 1
