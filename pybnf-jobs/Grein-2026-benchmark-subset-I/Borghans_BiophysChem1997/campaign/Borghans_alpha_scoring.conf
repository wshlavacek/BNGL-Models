# Acceptance benchmark for lanl/PyBNF#563, arm 1: BIPOP-CMA-ES alone.
#
# The four arms differ ONLY in the method. The problem block below is byte-identical
# across all four and is the one the 15-run BIPOP-CMA-ES baseline was produced with, so
# the arms are paired on the same objective, the same priors and the same seeds. No
# fitted solution is supplied and no burst-specific knots are placed.
#
# run_benchmark_campaign.py substitutes random_seed, output_dir, wall_time_fit and
# parallel_count per run; everything else is fixed here.
job_type = cmaes
# sigma profiled analytically (ADR-0108): otherwise a random box draw for sigma dominates
# the objective and the scan measures the measurement model instead of the period.
noise_profiling = 1
population_size = 16
max_iterations = 100000
cmaes_restarts = 50
cmaes_restart_strategy = bipop
cmaes_ipop_factor = 2.0
cmaes_run_maxgen = 500
cmaes_sigma0 = 0.3
cmaes_stop_tol = 1e-8
cmaes_tolfun = 1e-4
refine = 0
parallel_count = 3
wall_time_sim = 10
verbosity = 1
sbml_backend = bngsim
random_seed = 1
output_dir = output_alpha_scoring
wall_time_fit = 1500

edition = 2
model: model_Borghans_BiophysChem1997.xml
noise_model = lognormal, sigma = fit sigma
observable: Ca, formula: Z_state*scale + offset
experiment: experiment1, method: ode, data: experiment1.exp
loguniform_var = K2 0.001 100000
loguniform_var = K_par 0.001 100000
loguniform_var = Ka 0.001 100000
loguniform_var = Kd 0.001 100000
loguniform_var = Kf 0.001 100000
loguniform_var = Kp 0.001 100000
loguniform_var = Ky 0.001 100000
loguniform_var = Kz 0.001 100000
loguniform_var = Vd 0.001 100000
loguniform_var = Vm2 0.001 100000
loguniform_var = Vm3 0.001 100000
loguniform_var = Vp 0.001 100000
loguniform_var = beta_par 0.001 100000
loguniform_var = epsilon_par 0.001 100000
uniform_var = init_A_state 0 1
uniform_var = init_Y_state 0 1
uniform_var = init_Z_state 0 1
loguniform_var = n_par 0.001 100000
loguniform_var = offset 0.001 100000
loguniform_var = scale 0.001 100000
loguniform_var = sigma 0.001 100000
loguniform_var = v0 0.001 100000
loguniform_var = v1 0.001 100000
