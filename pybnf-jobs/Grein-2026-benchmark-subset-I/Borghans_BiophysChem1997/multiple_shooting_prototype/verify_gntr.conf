# Independent verification through PyBNF's own objective and its own config surface:
# gntr seeded exactly at the multiple-shooting solution. The evaluated start point
# lands in the trajectory with PyBNF's own score.
job_type = gntr
population_size = 1
max_iterations = 1
gntr_max_iterations = 1
verbosity = 2
sbml_backend = bngsim
output_dir = output_verify

edition = 2
model: model_Borghans_BiophysChem1997.xml
noise_model = lognormal, sigma = fit sigma
observable: Ca, formula: Z_state*scale + offset
experiment: experiment1, method: ode, data: experiment1.exp
