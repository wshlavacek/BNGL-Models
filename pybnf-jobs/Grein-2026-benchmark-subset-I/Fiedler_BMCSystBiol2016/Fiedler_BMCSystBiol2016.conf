# Imported from a PEtab v2 problem by pybnf.petab.import_job (#407).
# The PEtab *problem* (parameters/priors, observables/noise, measurements,
# conditions) is recovered exactly and round-trips through a re-export. The
# run-recipe below (job_type + algorithm settings, the per-experiment method:,
# and output/verbosity) is SUPPLIED, not recovered: PEtab is a problem spec with
# no home for the method, so it is not part of the round-trip identity.

output_dir = output
edition = 2

model: model_Fiedler_BMCSystBiol2016.xml
job_type = gntr
objective = chi_sq
noise_model pErk = gaussian, sigma = formula noiseParameter1_pErk*noiseParameter2_pErk
noise_model pMek = gaussian, sigma = formula noiseParameter1_pMek*noiseParameter2_pMek
observable: pErk, formula: pERK * observableParameter1_pErk
observable: pMek, formula: pMEK * observableParameter1_pMek

condition: model1_data1, perturbations: Sorafenib = 0, UO126 = 0
condition: model1_data2, perturbations: Sorafenib = 5, UO126 = 0
condition: model1_data3, perturbations: Sorafenib = 0, UO126 = 30
experiment: experiment____model1_data1, condition: model1_data1, method: ode, measurement_params: experiment____model1_data1_measparams.tsv, data: experiment____model1_data1.exp, experiment____model1_data1_rep2.exp
experiment: experiment____model1_data2, condition: model1_data2, method: ode, measurement_params: experiment____model1_data2_measparams.tsv, data: experiment____model1_data2.exp, experiment____model1_data2_rep2.exp
experiment: experiment____model1_data3, condition: model1_data3, method: ode, measurement_params: experiment____model1_data3_measparams.tsv, data: experiment____model1_data3.exp, experiment____model1_data3_rep2.exp

loguniform_var = K_1 1e-05 1000
loguniform_var = K_2 1e-05 1000
loguniform_var = K_3 1e-05 1000
loguniform_var = k10 1e-05 100000
loguniform_var = k11 1e-05 100000
loguniform_var = k2 1e-05 100000
loguniform_var = k3 1e-05 100000
loguniform_var = k4 1e-05 100000
loguniform_var = k5 1e-05 100000
loguniform_var = k6 1e-05 100000
loguniform_var = s_pErk_20140430_gel1 1e-05 1000
loguniform_var = s_pErk_20140430_gel2 1e-05 1000
loguniform_var = s_pErk_20140505_gel1 1e-05 1000
loguniform_var = s_pErk_20140505_gel2 1e-05 1000
loguniform_var = s_pMek_20140430_gel1 1e-05 1000
loguniform_var = s_pMek_20140430_gel2 1e-05 1000
loguniform_var = s_pMek_20140505_gel1 1e-05 1000
loguniform_var = s_pMek_20140505_gel2 1e-05 1000
loguniform_var = sigma_pErk 1e-05 1000
loguniform_var = sigma_pMek 1e-05 1000
loguniform_var = tau1 1e-08 100000000
loguniform_var = tau2 1e-08 100000000

population_size = 20
max_iterations = 500
verbosity = 1
sbml_backend = bngsim
wall_time_sim = 30
random_seed = 1
