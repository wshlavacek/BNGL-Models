# Imported from a PEtab v2 problem by pybnf.petab.import_job (#407).
# The PEtab *problem* (parameters/priors, observables/noise, measurements,
# conditions) is recovered exactly and round-trips through a re-export. The
# run-recipe below (job_type + algorithm settings, the per-experiment method:,
# and output/verbosity) is SUPPLIED, not recovered: PEtab is a problem spec with
# no home for the method, so it is not part of the round-trip identity.

output_dir = output
edition = 2

model: model_Laske_PLOSComputBiol2019.xml
job_type = gntr
objective = chi_sq
noise_model R_M5 = lnnormal, sigma = fit sigma_RM5
noise_model RVSegTot = lnnormal, sigma = fit sigma_RV
noise_model RCSegTot = lnnormal, sigma = fit sigma_RC
noise_model V_rel = lnnormal, sigma = fit sigma_Vrel
noise_model IntNucOffset = gaussian, sigma = formula 13.0334748500416*scale_sigma_FracNucInt
noise_model FracNucInt_1 = gaussian, sigma = formula 3.10956052629092*scale_sigma_FracNucInt
noise_model FracNucInt_2 = gaussian, sigma = formula 3.44650910342625*scale_sigma_FracNucInt
noise_model FracNucInt_3 = gaussian, sigma = formula 1.96540708251497*scale_sigma_FracNucInt
noise_model FracNucInt_4 = gaussian, sigma = formula 3.03676774438437*scale_sigma_FracNucInt
noise_model FracNucInt_5 = gaussian, sigma = formula 4.00311961683219*scale_sigma_FracNucInt
noise_model FracNucInt_6 = gaussian, sigma = formula 4.8783911282307*scale_sigma_FracNucInt
noise_model FracNucInt_7 = gaussian, sigma = formula 3.96353798182046*scale_sigma_FracNucInt
noise_model FracNucInt_8 = gaussian, sigma = formula 4.8820897165046*scale_sigma_FracNucInt
observable: RVSegTot, formula: 0.125*R_V + 1.0*V_att_Hi + 1.0*V_att_Lo + 1.0*V_end + 0.125*Vp_cyt + 0.125*Vp_cyt_M1 + 0.125*Vp_nuc + 0.125*Vp_nuc_M1 + vRNA_offset
observable: RCSegTot, formula: 0.125*Cp + 0.125*R_C + 0.125*R_C_RdRp
observable: IntNucOffset, formula: Int_nuc_off
observable: FracNucInt_1, formula: Int_nuc_off + (100.0*(Vp_nuc + Vp_nuc_M1))/(Vp_nuc_M1 + (Vp_nuc + (Vp_cyt_M1 + (8.0*V_end + Vp_cyt))))
observable: FracNucInt_2, formula: Int_nuc_off + (100.0*(Vp_nuc + Vp_nuc_M1))/(Vp_nuc_M1 + (Vp_nuc + (Vp_cyt_M1 + (8.0*V_end + Vp_cyt))))
observable: FracNucInt_3, formula: Int_nuc_off + (100.0*(Vp_nuc + Vp_nuc_M1))/(Vp_nuc_M1 + (Vp_nuc + (Vp_cyt_M1 + (8.0*V_end + Vp_cyt))))
observable: FracNucInt_4, formula: Int_nuc_off + (100.0*(Vp_nuc + Vp_nuc_M1))/(Vp_nuc_M1 + (Vp_nuc + (Vp_cyt_M1 + (8.0*V_end + Vp_cyt))))
observable: FracNucInt_5, formula: Int_nuc_off + (100.0*(Vp_nuc + Vp_nuc_M1))/(Vp_nuc_M1 + (Vp_nuc + (Vp_cyt_M1 + (8.0*V_end + Vp_cyt))))
observable: FracNucInt_6, formula: Int_nuc_off + (100.0*(Vp_nuc + Vp_nuc_M1))/(Vp_nuc_M1 + (Vp_nuc + (Vp_cyt_M1 + (8.0*V_end + Vp_cyt))))
observable: FracNucInt_7, formula: Int_nuc_off + (100.0*(Vp_nuc + Vp_nuc_M1))/(Vp_nuc_M1 + (Vp_nuc + (Vp_cyt_M1 + (8.0*V_end + Vp_cyt))))
observable: FracNucInt_8, formula: Int_nuc_off + (100.0*(Vp_nuc + Vp_nuc_M1))/(Vp_nuc_M1 + (Vp_nuc + (Vp_cyt_M1 + (8.0*V_end + Vp_cyt))))

condition: virus_infection, perturbations: V_ex = 50, k_syn_P = 64800
condition: virus_infection_2, perturbations: V_ex = 1, k_syn_P = 64800
condition: virus_infection_3, perturbations: V_ex = 50, k_syn_P = 0
experiment: experiment____virus_infection, condition: virus_infection, method: ode, data: experiment____virus_infection.exp
experiment: experiment____virus_infection_2, condition: virus_infection_2, method: ode, data: experiment____virus_infection_2.exp
experiment: experiment____virus_infection_3, condition: virus_infection_3, method: ode, data: experiment____virus_infection_3.exp

loguniform_var = k_imp 1e-10 10000000000
loguniform_var = k_syn_R_M 1e-10 10000000000
loguniform_var = k_syn_R_C 1e-10 10000000000
loguniform_var = k_syn_R_V 1e-10 10000000000
loguniform_var = k_bind_M1 1e-10 10000000000
loguniform_var = k_rel 1e-10 10000000000
loguniform_var = vRNA_offset 1e-10 10000000000
loguniform_var = Int_nuc_off 1e-10 10000000000
loguniform_var = scale_sigma_FracNucInt 0.001 1000
loguniform_var = sigma_RM5 0.001 1000
loguniform_var = sigma_RV 0.001 1000
loguniform_var = sigma_RC 0.001 1000
loguniform_var = sigma_Vrel 0.001 1000

population_size = 100
max_iterations = 1000
verbosity = 1
sbml_backend = bngsim
wall_time_sim = 30
random_seed = 1
