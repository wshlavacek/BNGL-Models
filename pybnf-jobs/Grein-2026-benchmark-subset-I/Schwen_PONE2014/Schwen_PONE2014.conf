# Imported from a PEtab v2 problem by pybnf.petab.import_job (#407).
# The PEtab *problem* (parameters/priors, observables/noise, measurements,
# conditions) is recovered exactly and round-trips through a re-export. The
# run-recipe below (job_type + algorithm settings, the per-experiment method:,
# and output/verbosity) is SUPPLIED, not recovered: PEtab is a problem spec with
# no home for the method, so it is not part of the round-trip identity.

output_dir = output
edition = 2

model: model_Schwen_PONE2014.xml
job_type = gntr
objective = chi_sq
noise_model observable_IR1 = lognormal, sigma = fit IR_obs_std
noise_model observable_IR2 = lognormal, sigma = fit IR_obs_std
noise_model observable_IRsum = lognormal, sigma = fit IR_obs_std
noise_model observable_Insulin = lognormal, sigma = fit std
observable: observable_IR1, formula: scale*(IR1 + IR1in + offset)
observable: observable_IR2, formula: scale*(IR2 + IR2in + offset)
observable: observable_IRsum, formula: scale*(0.605*IR1 + 0.605*IR1in + 0.395*IR2 + 0.395*IR2in + offset)
observable: observable_Insulin, formula: observableParameter1_observable_Insulin + observableParameter2_observable_Insulin * (Ins + InsulinFragments * observableParameter3_observable_Insulin) / ((Ins + InsulinFragments * observableParameter3_observable_Insulin) / observableParameter4_observable_Insulin + 1)

condition: model1_data1, perturbations: init_Ins = 0
condition: model1_data2, perturbations: init_Ins = 0.1
condition: model1_data3, perturbations: init_Ins = 1
condition: model1_data4, perturbations: init_Ins = 10
condition: model1_data5, perturbations: init_Ins = 100
condition: model1_data6, perturbations: init_Ins = 1000
condition: model1_data7, perturbations: init_Ins = 10000
condition: model1_data8, perturbations: init_Ins = 0
condition: model1_data9, perturbations: init_Ins = 10
condition: model1_data10, perturbations: init_Ins = 10000
condition: model1_data11, perturbations: init_Ins = 0
condition: model1_data12, perturbations: init_Ins = 10
condition: model1_data13, perturbations: init_Ins = 100
condition: model1_data14, perturbations: init_Ins = 0
condition: model1_data15, perturbations: init_Ins = 10
condition: model1_data16, perturbations: init_Ins = 100
condition: model1_data17, perturbations: init_Ins = 0
condition: model1_data18, perturbations: init_Ins = 100
condition: model1_data19, perturbations: init_Ins = 10000
