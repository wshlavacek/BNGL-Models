# Imported from a PEtab v2 problem by pybnf.petab.import_job (#407).
# The PEtab *problem* (parameters/priors, observables/noise, measurements,
# conditions) is recovered exactly and round-trips through a re-export. The
# run-recipe below (job_type + algorithm settings, the per-experiment method:,
# and output/verbosity) is SUPPLIED, not recovered: PEtab is a problem spec with
# no home for the method, so it is not part of the round-trip identity.

job_type = gntr
population_size = 100
max_iterations = 1000
wall_time_sim = 10
verbosity = 1
sbml_backend = bngsim
random_seed = 1
output_dir = output

# An explicit absolute tolerance. Weber's seven species sit at 1.24e+02 .. 4.21e+07, median
# 4.67e+05, so ADR-0103's derivation computes `rtol * median` = 4.665e-03 for this model and then
# clamps it to the 1e-08 backend default, 5.7 decades tighter. ADR-0105's per-species vector cannot
# engage either: its entries clamp into [scalar_atol, default_atol], which here is [1e-8, 1e-8].
#
# HISTORY, because this line's original justification is now wrong and the wrong version is the
# memorable one. Until 2026-08-11 this slug could not be fitted at the derived tolerance: 6 of 30
# sensitivity-applied box points integrated, against 22 at 1e-04, and ~80% of starts died. That was
# NOT the tolerance. It was lanl/bngsim#305 -- a registered time-discontinuity root the integrator
# could never reach, so the run wedged one ulp below t = 24 (this model's PdBu_time / kb_NB142_70_time
# crossing). Fixed in bngsim 0.13.0; the fix's own changelog measures this slug and reports the step
# count roughly halving. Re-measured 2026-08-19 on bngsim 0.13.0, 30 box points with the gntr
# sensitivity request applied: EVERY tolerance arm integrates 30/30 within 7.2 s of each other --
# unset, 1e-08, 1e-04, and PyBNF's new `auto` / `tracking` (lanl/PyBNF#557, ADR-0114).
#
# SO WHY KEEP IT. Not integrability any more -- cost and gradient smoothness, both measured on the
# current stack. Over 20 box points, CVODE steps: 78641 at the clamped 1e-08 against 36154 at the
# derivation's own 4.665e-03. And the finite-difference agreement of the assembled gradient
# (tools/fd_check.py, 3% box displacement), worst relative error over all 36 columns:
#
#   sbml_atol        h=3e-4     h=1e-3     h=3e-3
#   1e-08 (derived)  9.20e-03   1.87e-03   4.74e-04
#   1e-04 (shipped)  4.43e-03   1.48e-03   8.44e-04
#   auto (4.665e-3)  3.29e-02   3.10e-02   4.90e-03
#
# `auto` is ~7x worse than 1e-04 at the default step and ~20x worse at 1e-3, which is the trade
# ADR-0114 documents: a looser tolerance costs OBJECTIVE SMOOTHNESS, not accuracy, and objective
# smoothness is exactly what a trust-region line search consumes. 1e-04 is the knee -- near the
# clamped tolerance's gradient agreement at half its integrator cost. THIS IS WHY `sbml_atol = auto`
# IS NOT USED HERE despite being the setting written for models of this shape.
#
# Accuracy is not the thing being traded: J_paper at the PEtab nominal point reads 296.2018011 at
# the clamped tolerance, 296.2018264 here, and 296.2018660 under `auto` -- the 6th decimal across
# the whole 5.7-decade sweep.
# NOTE this also becomes the steady-state convergence cutoff for the `preequilibrate:` phase
# (ADR-0105 pairs the two, and PyBNF has no separate key); 1e-04 against states of 1e+02..1e+07 is
# still a stringent equilibrium, and the nominal J_paper above is the evidence it converges.
sbml_atol = 1e-4

edition = 2
model: model_Weber_BMC2015.xml
objective = chi_sq
noise_model yCERTpRN24 = gaussian, sigma = fit std_yCERTpRN24
noise_model yCERTt = gaussian, sigma = fix_at 244727220.419
noise_model yPI4K3BpRN24 = gaussian, sigma = fit std_yPI4K3BpRN24
noise_model yPI4K3Bt = gaussian, sigma = fix_at 887676.131
noise_model yPKDpN0 = gaussian, sigma = fit std_yPKDpN0
noise_model yPKDpN24 = gaussian, sigma = fit std_yPKDpN24
noise_model yPKDpN25 = gaussian, sigma = fit std_yPKDpN25
noise_model yPKDt = gaussian, sigma = fix_at 1910527.835
observable: yCERTpRN24, formula: CERT*scale_yCERTpRN24/(CERTTGNa + (CERT + CERTERa))
observable: yCERTt, formula: CERT + CERTERa + CERTTGNa
observable: yPI4K3BpRN24, formula: PI4K3Ba*scale_yPI4K3BpRN24/(PI4K3B + PI4K3Ba)
observable: yPI4K3Bt, formula: PI4K3B + PI4K3Ba
observable: yPKDpN0, formula: PKDDAGa*scale_yPKDpN0
observable: yPKDpN24, formula: PKDDAGa*scale_yPKDpN24
observable: yPKDpN25, formula: PKDDAGa*scale_yPKDpN25
observable: yPKDt, formula: PKD + PKDDAGa
condition: model1_data1, perturbations: Ect_Expr_CERT_flag = 0, Ect_Expr_PI4K3beta_flag = 0, PdBu_dose = 0, PdBu_time = 0, kb_NB142_70_dose = 0, kb_NB142_70_time = 0
condition: model1_data2, perturbations: Ect_Expr_CERT_flag = 0, Ect_Expr_PI4K3beta_flag = 1, PdBu_dose = 1, PdBu_time = 24, kb_NB142_70_dose = 0, kb_NB142_70_time = 0
condition: model1_data3, perturbations: Ect_Expr_CERT_flag = 1, Ect_Expr_PI4K3beta_flag = 0, PdBu_dose = 0, PdBu_time = 0, kb_NB142_70_dose = 10, kb_NB142_70_time = 24
experiment: experiment__model1_data1___model1_data2, preequilibrate: model1_data1, condition: model1_data2, method: ode, data: experiment__model1_data1___model1_data2.exp, experiment__model1_data1___model1_data2_rep2.exp, experiment__model1_data1___model1_data2_rep3.exp, experiment__model1_data1___model1_data2_rep4.exp, experiment__model1_data1___model1_data2_rep5.exp
experiment: experiment__model1_data1___model1_data3, preequilibrate: model1_data1, condition: model1_data3, method: ode, data: experiment__model1_data1___model1_data3.exp, experiment__model1_data1___model1_data3_rep2.exp, experiment__model1_data1___model1_data3_rep3.exp, experiment__model1_data1___model1_data3_rep4.exp
loguniform_var = a11 0.0001 100
loguniform_var = a12 0.0001 100
loguniform_var = a21 0.0001 100
loguniform_var = a22 0.0001 100
loguniform_var = a31 0.0001 100
loguniform_var = a32 0.0001 100
loguniform_var = a33 0.0001 100
loguniform_var = m11 100 10000000000
loguniform_var = m22 100 10000000000
loguniform_var = m31 100 10000000000
loguniform_var = m33 100 10000000000
loguniform_var = p11 1e-05 100000
loguniform_var = p12 1e-05 100000
loguniform_var = p13 1e-05 100000
loguniform_var = p21 1e-05 100000
loguniform_var = p22 1e-05 100000
loguniform_var = p31 1e-05 100000
loguniform_var = p32 1e-05 100000
loguniform_var = p33 1e-05 100000
loguniform_var = pu3 0.1 100000000
loguniform_var = pu4 0.1 100000000
loguniform_var = pu5 0.1 100000000
loguniform_var = pu6 0.1 100000000
loguniform_var = s12 100 10000000
loguniform_var = s21 100 10000000
loguniform_var = s31 100 10000000
loguniform_var = scale_yCERTpRN24 1e-05 1000
loguniform_var = scale_yPI4K3BpRN24 1e-05 1000
loguniform_var = scale_yPKDpN0 1e-05 1000
loguniform_var = scale_yPKDpN24 1e-05 1000
loguniform_var = scale_yPKDpN25 1e-05 1000
loguniform_var = std_yPKDpN0 0.01 100
loguniform_var = std_yPKDpN24 0.01 100
loguniform_var = std_yPKDpN25 0.01 100
loguniform_var = std_yPI4K3BpRN24 0.01 100
loguniform_var = std_yCERTpRN24 0.01 100
