# NF-kB module of the innate immune response -- TNF-alpha time courses, WT and A20 KO.
# Deterministic ODE (53 species, 96 reactions). Real-world PyBNF edition-2 fitting job
# derived from:
#   Korwek Z, Czerkies M, Jaruszewicz-Blonska J, Prus W, Kosiuk I, Kochanczyk M,
#   Lipniacki T. "Nonself RNA rewires IFN-beta signaling: A mathematical model of the
#   innate immune response." Sci Signal 2023; 16(815):eabq1173.
#   DOI: 10.1126/scisignal.abq1173
#   (The authors provide this rule-based model as data file S2.)
#
# FIT TARGET: the fifteen NF-kB-module rate constants that Korwek et al. report as FITTED in
#   table S1, refit against the TNF-alpha data of fig. S12. The paper states that TNF-alpha
#   "is used to calibrate kinetic rate constants in the NF-kB pathway module that follows
#   Lipniacki et al. (2004) and Tay et al. (2010)", so this job reproduces a documented
#   calibration step of the paper rather than inventing one. TNF-alpha reaches the NF-kB
#   module alone -- the poly(I:C), IRF3, IFN-beta and STAT1/2 modules stay quiescent under
#   this stimulus -- so the protocol isolates that module inside the complete model.
#
# DATA: four blots from fig. S12 (10 ng/ml TNF-alpha throughout), each supplied as two
#   replicate .exp files, the blot reproduced in the figure (_r1) and the additional
#   replicate (_r2); 111 measurements in total.
#     wt_nuclear  fig. S12A   nuclear NF-kB (RelA), WT, 9 lanes over 6 h
#     wt_fine     fig. S12B   p-IKK / IkBa / A20, WT, 10 lanes over 3 h
#     wt_long     fig. S12B   p-IKK / IkBa / A20, WT, 8 lanes over 6 h
#     a20ko       fig. S12B   p-IKK / IkBa, TNFAIP3 (A20) KO, 8 lanes over 6 h
#   Neither the blot quantifications nor the model curves are tabulated anywhere in the
#   paper, so both were DIGITIZED from the supplementary PDF by
#   models/innate_immune_response_korwek2023/digitize_korwek2023.py, which calibrates each
#   log panel on its own axis tick marks (~53 px per decade, so ~4% per pixel) and flags
#   every marker that sits on the axis floor or is clipped at the top. Flagged markers are
#   NaN here: they are not measurements. No error bars are published, so the _SD columns
#   carry a flat 25% relative uncertainty -- the paper's own figure, from table 1, where the
#   "average multiplicative error between experimental replicates (for Western blots)" over
#   all 2915 fitted points is 1.24. Regenerate the .exp files with make_exp.py.
#
# SCALE FACTORS: the blots are quantified as a "relative level", each normalized to a loading
#   control and then to an arbitrary per-blot reference, which is why every panel straddles 1
#   on a log axis. That per-blot constant is not published and is not a property of the model,
#   so one is estimated per blot and per protein as an explicit free parameter, entering
#   through an `observable: ..., formula:` measurement model. This keeps the job inside the
#   PEtab-exportable subset -- `normalization = ...` would not be (see the skill's
#   petab-compliance reference). fig. S12B's own wild-type fine and long panels confirm the
#   need: they are two blots of ONE experiment and their published model curves differ by a
#   near-constant factor, so they cannot share a scale factor.
#
# A20 KO: h_A20_gene gates TNFAIP3 transcription. It is not in the authors' data file S2,
#   which ships h_Mavs, h_Pkr_gene and h_Rnasel_gene; it is added in the same idiom because
#   the paper simulates A20 KO cells in fig. S12B. Deleting A20 removes the slower of the two
#   NF-kB negative feedbacks (A20 accelerates both IKK inactivation and TBK1
#   dephosphorylation), so the KO arm constrains d_Ikk_1 and d_Ikk_2 independently of the A20
#   synthesis parameters -- it is what makes the IKK cycle identifiable from these data.
#
# Experimental design: pre-equilibrate to the resting, unstimulated steady state (TNFa() = 0)
#   -> apply TNF-alpha (TNFa() = 1) -> measure. The A20 KO experiment carries h_A20_gene = 0
#   through BOTH phases. State carries across phases with no reset (ADR-0052).
#   The equilibration runs for a FIXED 1.2e6 s (14 days, equil_t_end:) rather than the ODE
#   default of a steady-state solve. The model is stiff -- k_FAST is 1 /s while sg_PROTEIN is
#   1.5e-5 /s, five decades apart -- and CVODE exhausts its step budget inside the
#   steady-state solver ("mxstep steps taken before reaching tout"), scoring the parameter
#   sets it happens on as inf. A fixed interval integrates cleanly. 1.2e6 s is long enough:
#   the slowest approach to the resting state is A20's, whose turnover constant sg_A20 gives
#   a 2.2-day time constant, and by 1.2e6 s A20 is within 0.2% of its 30-day value -- far
#   inside the ~4% precision of the digitized data.
#
# Run (with BNGPATH set, from this folder):
#   cd pybnf-jobs/Korwek-2023/nfkb_tnfa && pybnf -c nfkb_tnfa.conf

output_dir = output

edition = 2
bngl_backend = bngsim

model: nfkb_tnfa.bngl

#######################
### General Options ###
#######################

delete_old_files = 1
wall_time_sim = 3600

##################
### Conditions ###
##################
# TNF-alpha is delivered as a bolus onto the SPECIES TNFa() -- a condition target containing
# '(' routes to setConcentration rather than setParameter (#474), which is what a
# mid-protocol stimulus needs: setting a parameter that a seed species happens to reference
# would not change the species amount already carried over from the equilibration phase.
# "TNFa()" = 1 is the 10 ng/ml used throughout fig. S12. The KO conditions additionally
# silence the TNFAIP3 gene, in both the equilibration and the stimulation phase.
condition: rest,     perturbations: "TNFa()" = 0
condition: tnfa,     perturbations: "TNFa()" = 1
condition: rest_ko,  perturbations: "TNFa()" = 0, h_A20_gene = 0
condition: tnfa_ko,  perturbations: "TNFa()" = 1, h_A20_gene = 0

###################
### Observables ###
###################
# One measurement model per blot and per protein: the model observable times that blot's own
# unknown normalization constant. The names on the left are the .exp column headers.
observable: NFkBn_nuc, formula: s_NFkBn_nuc * NFkB_nuc_total

observable: pIKK_fine, formula: s_pIKK_fine * IKK_a
observable: IkBa_fine, formula: s_IkBa_fine * IkBa_total
observable: A20_fine,  formula: s_A20_fine * A20

observable: pIKK_long, formula: s_pIKK_long * IKK_a
observable: IkBa_long, formula: s_IkBa_long * IkBa_total
observable: A20_long,  formula: s_A20_long * A20

observable: pIKK_ko,   formula: s_pIKK_ko * IKK_a
observable: IkBa_ko,   formula: s_IkBa_ko * IkBa_total

###################
### Experiments ###
###################
# Each experiment binds its two replicate blots. All four share the fifteen kinetic
# parameters; each has its own scale factors.
experiment: wt_nuclear, preequilibrate: rest,    equil_t_end: 1200000, condition: tnfa, data: nfkb_tnfa_wt_nuclear_r1.exp, nfkb_tnfa_wt_nuclear_r2.exp
experiment: wt_fine,    preequilibrate: rest,    equil_t_end: 1200000, condition: tnfa, data: nfkb_tnfa_wt_fine_r1.exp, nfkb_tnfa_wt_fine_r2.exp
experiment: wt_long,    preequilibrate: rest,    equil_t_end: 1200000, condition: tnfa, data: nfkb_tnfa_wt_long_r1.exp, nfkb_tnfa_wt_long_r2.exp
experiment: a20ko,      preequilibrate: rest_ko, equil_t_end: 1200000, condition: tnfa_ko, data: nfkb_tnfa_a20ko_r1.exp, nfkb_tnfa_a20ko_r2.exp

#######################
### Fitting Options ###
#######################

job_type = de

# The data span two decades on a log axis and the nine measured columns differ in scale by up
# to a factor of 250, so an unweighted sum of squares would be dominated by a handful of large
# lanes. chi_sq with the flat 25% relative sigma the .exp files carry makes the objective a
# relative-error least squares -- the multiplicative-error criterion the paper uses -- and
# stays inside the PEtab-exportable subset. The two alternatives do not work here: norm_sos is
# not exportable (its relative sigma has no PEtab v2 shape in PyBNF 1.6.0; export_job refuses
# it, ADR-0021/0023, lanl/PyBNF#423), and ave_norm_sos is exportable but scores every
# parameter set inf on this data, because it normalizes by np.average rather than np.nanmean
# and these columns carry NaNs for the lanes the figure leaves unreadable
# (pybnf/objective.py:1702).
objective = chi_sq

max_iterations = 300
population_size = 48
refine = 1
verbosity = 2

##################
### Parameters ###
##################
# The fifteen NF-kB-module constants marked FITTED in table S1, log-scaled and bracketed one
# decade either side of the published maximum-likelihood value. Everything else -- k_FAST,
# k_v, the poly(I:C)/IRF3/IFN-beta/STAT constants, and the shared tg_TRANSCRIPT and
# sg_PROTEIN rates -- is held at its published value: those modules are quiescent under
# TNF-alpha, so these data carry no information about them.

# TAK1 activation by TNF-alpha, and the IKK cycle it drives. d_Ikk_2 is dimensionless (it
# sets how strongly A20 accelerates IKK inactivation) and is the parameter the A20 KO arm
# pins down.
loguniform_var = a_Tak1_by_Tnfa         0.0890   8.904
loguniform_var = a_Ikk                  1.09e-3  1.09e-1
loguniform_var = d_Ikk_1                8.83e-5  8.83e-3
loguniform_var = d_Ikk_2                5.98e-3  5.98e-1
loguniform_var = d_Ikk_3                2.68e-5  2.68e-3

# IkBa: IKK-driven phosphorylation, basal turnover in complex with NF-kB, nucleocytoplasmic
# shuttling, transcription, and translation.
loguniform_var = p_Ikba_by_Ikk          8.46e-4  8.46e-2
loguniform_var = g_Ikba_u_with_Nfkb     3.94e-6  3.94e-4
loguniform_var = i_Ikba                 5.64e-5  5.64e-3
loguniform_var = e_Ikba                 2.05e-3  2.05e-1
loguniform_var = tg_Ikba_mrna           2.57e-5  2.57e-3
loguniform_var = a_Ikba_gene_by_Nfkb__  6.85e-3  6.85e-1
loguniform_var = s_Ikba                 4.26e-4  4.26e-2

# A20: transcription, NF-kB activation strength, and the shared synthesis/degradation rate.
loguniform_var = tg_A20_mrna            9.41e-5  9.41e-2
loguniform_var = a_A20_gene_by_Nfkb__   2.57e-3  2.57e-1
loguniform_var = sg_A20                 5.01e-7  5.01e-5

# Per-blot, per-protein normalization constants (nine nuisance parameters). The brackets are
# wide because the published normalization is arbitrary; the values recovered by the fit are
# reported in README.md alongside the constants recovered from the published figure itself.
loguniform_var = s_NFkBn_nuc            0.1      100
loguniform_var = s_pIKK_fine            0.1      1000
loguniform_var = s_IkBa_fine            0.1      100
loguniform_var = s_A20_fine             1.0      10000
loguniform_var = s_pIKK_long            0.1      1000
loguniform_var = s_IkBa_long            0.1      100
loguniform_var = s_A20_long             1.0      10000
loguniform_var = s_pIKK_ko              0.1      1000
loguniform_var = s_IkBa_ko              0.1      100
