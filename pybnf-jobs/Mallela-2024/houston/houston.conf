# COVID-19 transmission dynamics in the Houston MSA with VACCINATION and the SARS-CoV-2
# variants ALPHA and DELTA -- a GRADIENT-BASED (L-BFGS-B) fit of daily newly reported case
# counts over 2020-01-21..2021-10-30 (model day t = 0..648).
# MSA = Houston-The Woodlands-Sugar Land, TX.
#
# Real-world PyBNF edition-2 fitting job derived from:
#   Mallela A, Chen Y, Lin YT, Miller EF, Neumann J, He Z, Nelson KE, Posner RG, Hlavacek WS.
#   "Impacts of Vaccination and Severe Acute Respiratory Syndrome Coronavirus 2 Variants Alpha
#   and Delta on Coronavirus Disease 2019 Transmission Dynamics in Four Metropolitan Areas of
#   the United States." Bull Math Biol 2024; 86:31. DOI 10.1007/s11538-024-01258-4.
#   Model = Appendix Eqs. 1-40; fit target = panel A of Fig. 3; published MAP = Table 1.
#
# Port of the authors' OWN PyBioNetFit setup (lanl/PyBNF examples/Vax_and_Variants/Houston/:
#   Houston.bngl, Houston.conf, Houston.exp) from their legacy edition-1 adaptive-MCMC SAMPLING
#   run (fit_type=am, objfunc=neg_bin_dynamic) to an edition-2 GRADIENT FIT. The count likelihood
#   and its cumulative differencing are the authors' conf; the nominals in houston.bngl are the
#   authors' published MAP (Table 1 == Houston/Output/adaptive_files/MLE_params.txt).
#
# SCOPE -- A SMALL, FAST LOCAL REFINEMENT OF THE PUBLISHED MAP. The authors sampled all 19
#   model parameters plus the dispersion; this job frees only the two SMOOTH transmission
#   parameters, beta and fD, and pins everything else at the published MAP:
#     * every SWITCH TIME stays pinned -- t0, t_sigma, t_tau1..t_tau3, theta1, t_theta2. They
#       enter only through `if(t>=...)` conditions in Lambdatau(), Ptau(), Ytheta(), Utheta1()
#       and Utheta2(), so their in-branch df/dp is identically ZERO: a gradient optimizer
#       cannot move them unless the simulator supplies the finite jump each crossing
#       contributes (bngsim issue #48 / PR #50, forward sensitivity w.r.t. switch-time
#       parameters). Freeing them here would only add columns of zeros -- and a trial that
#       drops a switch time onto a surge can stall the integrator.
#     * the social-distancing setpoints/eigenvalues (p0..p3, lambda0..lambda3) and the variant
#       transmissibilities (y1, y2) stay pinned too, to keep this job to seconds-to-minutes and
#       the landscape identifiable. beta and fD are the two parameters the daily-case series
#       constrains most directly (an overall transmission scale and an overall reporting
#       fraction), and both are smooth everywhere.
#   The published MAP is an MCMC-sampled mode, not an optimum, so a 2-parameter L-BFGS-B run
#   is expected to LOWER the negative-binomial NLL slightly. See VALIDATION.md.
#
# NATIVE-ONLY (not PEtab-exportable): the negative-binomial count likelihood, the mean
#   location, and the cumulative->incident transform are outside the PEtab v2 subset. Verify
#   with export_job raising NotImplementedError plus a real fit, NOT with a PEtab round-trip.
#
# Fit data -- DAILY newly reported cases: houston.exp (`#time fDCs_Cum`, t = 0..648), the New York
#   Times MSA-aggregated surveillance series the paper fits. The model observable fDCs_Cum is the
#   cumulative detected-case count fD*C_S(t) (Eqs. 39-40); the per-observable `cumulative` flag
#   differences it row-to-row into daily incidence before scoring. fDCs_Cum is a Molecules
#   observable (no parens).
#
# Run (with BNGPATH set, from this folder):
#   cd pybnf-jobs/Mallela-2024/houston && pybnf -c houston.conf

output_dir = output

edition = 2
# bngsim is REQUIRED for a gradient job_type: the residual Jacobian comes from its forward
# output-sensitivity tensor, and there is no finite-difference fallback.
bngl_backend = bngsim

# counter() seeds at 0 and grows at rate 1, so the observable `t` equals simulation time.
model: houston.bngl

#######################
### General Options ###
#######################

delete_old_files = 1
verbosity = 1

# Per-simulation wall-time cap (s). The network is small (42 species, 88 reactions) and a
# well-behaved run takes well under a second, but a trial parameter set can put a switch time on
# top of a stiff surge and grind the integrator; fail those fast rather than at the 3600 s default.
wall_time_sim = 60
max_failed_simulations = 100

#######################
### Fitting Options ###
#######################

# L-BFGS-B -- a bounded quasi-Newton GRADIENT optimizer, replacing the authors' `am` adaptive-MCMC
# sampler. lbfgs rather than trf because the negative-binomial count likelihood is not an exact
# sum of squares, so trf (trust-region least-squares) refuses it; lbfgs consumes the scalar
# gradient, which the assembly returns for the count families.
job_type = lbfgs

# Local multi-start: 3 independent L-BFGS-B runs, keeping the global best. Start 0 is the BOX
# CENTER of the priors below (gradient_base.py `_n_starts_key = 'population_size'`;
# local_base.py `_resolve_start_pset`), i.e. the published MAP -- see the bounds note. The other
# two are Latin-hypercube draws from the same box. With 2 free parameters this converges in a
# handful of iterations; the budget below runs in a few minutes.
population_size = 3
max_iterations = 20

# Negative-binomial COUNT likelihood (the authors' objfunc=neg_bin_dynamic): over-dispersed integer
# counts scored against the model's predicted MEAN. location = mean is MANDATORY (the ODE gives the
# mean; neg_bin defaults to median). The dispersion is FIXED at the authors' published estimate
# r = 2.98251 (Table 1) rather than fit, so this job estimates only the two model parameters and
# the likelihood surface is exactly the one the paper's r defines. The whole-fit line names the
# global objective; the per-observable line adds the cumulative->incident transform (`cumulative`
# is per-observable ONLY).
noise_model = neg_bin, dispersion = fix_at 2.98251, location = mean
noise_model fDCs_Cum = neg_bin, dispersion = fix_at 2.98251, location = mean, cumulative

###################
### Experiments ###
###################

# One time course: daily newly reported cases over t = 0..648 (first .exp column is `time`).
experiment: houston, data: houston.exp

##################
### Parameters ###
##################
# TWO free parameters, bound to the model ids BY NAME (ADR-0034, no __FREE alias):
#
#   id     published MAP   bounds        role
#   beta   0.286990        0.14  0.43    rate constant for disease transmission (/d)
#   fD     0.359294        0.18  0.54    fraction of new symptomatic infections detected
#
# BOUNDS ARE NARROW ON PURPOSE. A gradient job's start 0 is the BOX CENTER of the priors, not
# the .bngl nominals, so the authors' verbatim bounds (beta 0-20, fD 0-1) would start the search
# at beta = 10 -- a transmission rate ~35x the MAP, where CVODES stalls and the objective comes
# back inf. Each box below is the published MAP +/- 50 %, rounded to two decimals, so the box
# CENTER is the published MAP to within 0.5 % and start 0 is effectively the paper's estimate.
# Every other model parameter keeps its houston.bngl nominal, which is the published MAP.
uniform_var = beta 0.14 0.43
uniform_var = fD   0.18 0.54
