# UCB-0595-distorted TNF sequential TNFR1 fit (McMillan 2021) -- ODE titration.
#
# McMillan D, Martinez-Fleites C, Porter J, Fox D 3rd, Davis R, Mori P, et al.
# "Structural insights into the disruption of TNF-TNFR1 signalling by small
# molecules stabilising a distorted TNF." Nat Commun 2021;12:582.
# DOI: 10.1038/s41467-020-20828-3.
#
# Fit target: Fig. 1b, right panel. The seven IMS-MS occupancy measurements are
# copied from the publisher's Source Data workbook, sheet "Fig 1b", cells
# B3:C10 and H3:K10. The model is reconstructed from Supplementary Software 1.
#
# This quantitative job stays inside the PEtab-v2-exportable subset.
# Run from this folder with BNGPATH set: pybnf -c tnfr1_ucb0595.conf

output_dir = output
edition = 2
bngl_backend = bngsim
model: tnfr1_ucb0595.bngl

#######################
### General Options ###
#######################

delete_old_files = 1
verbosity = 2
random_seed = 2021

###################
### Experiments ###
###################

# Scan soluble TNFR1 from 1 to 23 uM at fixed 5 uM trimeric TNF and read the
# four occupancy fractions after the authors' 10,000 s equilibration interval.
experiment: fig1b_ucb0595, type: parameter_scan, t_end: 10000, data: fig1b_ucb0595.exp

#######################
### Fitting Options ###
#######################

job_type = de
objective = sos
max_iterations = 50
population_size = 12

##################
### Parameters ###
##################

# Sequential single-free-site Kd values in nM; ranges bracket the Fig. 1b
# estimates (0.04, 0.19, and 9612 nM) while allowing weak identifiability.
loguniform_var = Kd_1 1e-5 100
loguniform_var = Kd_2 1e-5 1000
loguniform_var = Kd_3 10 1e6
