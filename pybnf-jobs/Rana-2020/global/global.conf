# Abeta42 competing-pathway aggregation -- the global fit over all five ThT experiments.
# Deterministic ODE (23 species, 80 reactions). Real-world PyBNF edition-2 fitting job
# derived from:
#   Rana P, Bose P, Vaidya A, Rangachari V, Ghosh P. "Global fitting and parameter
#   identifiability for amyloid-beta aggregation with competing pathways."
#   2020 IEEE 20th Int. Conf. on BioInformatics and BioEngineering (BIBE):73-78.
#   DOI: 10.1109/BIBE50027.2020.00020
#
# FIT TARGET: the paper's headline result, Sec. IV-D. "We also performed a global fit of
#   all the five curves: on pathway data, micelle addition at 3h and 24 hour, micelle
#   removal at 5h and 24 hour... The achieved fit had a combined SSE of 8.2." One
#   parameterization has to satisfy all five protocols at once, which is what makes the
#   problem interesting: the individual fits of Sec. IV-B and IV-C disagree by up to three
#   orders of magnitude on the same constants (Table I), and the global fit is the paper's
#   answer to that. Table I's Global column reports k_con, k_fboff, k_nuoff, k_nuoff_,
#   k_nuon, k_nuon_, k_swi, k_off1 and k_off2, and Sec. IV-D finds all of them identifiable
#   except k_con and k_nuon_.
#
# DATA: 427 points -- the five curves the paper names, and only those (the two fatty-acid
#   controls belong to the individual jobs). Fig. 1a supplies the on-pathway trace, Fig. 1c
#   the two addition experiments, Fig. 1b the two removal experiments; the panel-to-section
#   assignment follows the body text rather than the caption, which has (b) and (c)
#   swapped. Rana et al. tabulate nothing, so every trace was DIGITIZED by
#   models/amyloid_beta_competing_aggregation_pathways_rana2020/digitize_rana2020.py.
#   Rebuild the tables with make_exp.py.
#
# EXPERIMENTAL DESIGN: each switching experiment is a fixed-length pre-equilibration phase
#   under one condition followed by the measured phase under the other, with `equil_t_end`
#   forcing a fixed interval instead of a steady-state solve (this model has no steady
#   state on that timescale) and state carrying across the boundary (ADR-0052). The
#   measured phase restarts the clock, so make_exp.py shifts the data by the event time and
#   drops the pre-event points. The on-pathway experiment needs no event; it runs the
#   complete competing-pathway model with the micelle pool empty, so the off pathway can
#   still be reached through the switching reaction of Eq. 5, exactly as in the paper's own
#   global model.
#
# Run (with BNGPATH set, from this folder):
#   cd pybnf-jobs/Rana-2020/global && pybnf -c global.conf

output_dir = output

edition = 2
bngl_backend = bngsim

model: global.bngl

#######################
### General Options ###
#######################

delete_old_files = 1
verbosity = 2

##################
### Conditions ###
##################
# Fatty acid enters and leaves as a bolus onto the SPECIES Mic() -- a condition target
# containing '(' routes to setConcentration rather than setParameter, which is what a
# mid-protocol change needs. 100 uM is the pseudo-micelle concentration formed by 5 mM C12
# fatty acid at an aggregation number of 50; it is held fixed because while micelles are in
# excess only the product k_con*[L] is identifiable, and k_con absorbs it.
# A species amount can only be set inline inside a pre-equilibration protocol
# (ADR-0062): a bare `condition:` on a plain time course is a separate mutant simulation
# and PyBNF's PEtab export refuses it. The no-event control therefore carries its micelles
# in the model's seed species and needs no condition, and every condition below belongs to
# a pre-equilibrated experiment. For the same reason each role gets its own condition name
# -- one condition cannot serve both a pre-equilibrated and a standalone experiment
# (ADR-0052).
condition: no_fa_pre,   perturbations: "Mic()" = 0
condition: fa_add,      perturbations: "Mic()" = 100
condition: fa_pre,      perturbations: "Mic()" = 100
condition: no_fa_post,  perturbations: "Mic()" = 0

###################
### Observables ###
###################
# Table I gives the global fit TWO off-pathway mapping constants, k_off1 and k_off2, where
# each individual fit has one (k_off). ThT_add and ThT_rem are those two measurement
# models: the addition series (Fig. 1a and 1c) and the removal series (Fig. 1b) are
# separate ThT experiments with their own arbitrary normalization, and one scale cannot
# serve both -- Fig. 1b plateaus near 1.5 a.u. while Fig. 1c plateaus near 1.0. The
# on-pathway fibril scale map_on is shared, because it is the same on-pathway signal in
# every panel. Writing these as measurement models rather than `normalization` keeps the
# job PEtab-exportable.
observable: ThT_add, formula: map_on * Obs_F + map_off1 * Obs_Fp1
observable: ThT_rem, formula: map_on * Obs_F + map_off2 * Obs_Fp1

###################
### Experiments ###
###################
experiment: on_pathway,   data: on_pathway.exp
experiment: addition_3h,  preequilibrate: no_fa_pre, equil_t_end: 3,  condition: fa_add,     data: addition_3h.exp
experiment: addition_24h, preequilibrate: no_fa_pre, equil_t_end: 24, condition: fa_add,     data: addition_24h.exp
experiment: removal_5h,   preequilibrate: fa_pre,    equil_t_end: 5,  condition: no_fa_post, data: removal_5h.exp
experiment: removal_24h,  preequilibrate: fa_pre,    equil_t_end: 24, condition: no_fa_post, data: removal_24h.exp

#######################
### Fitting Options ###
#######################

# Scatter search. Rana et al. compare fourteen COPASI optimizers on this exact problem
# (Table II) and report that for the global fit "only one algorithm (scatter search) was
# able to fit the data" -- 8.99 against 26-301 for every other method. Following that
# finding here is part of reproducing the paper.
job_type = ss

# Unweighted sum of squared error, the criterion Rana et al. report (SSE 8.2 for this
# fit). NOTE that the number PyBNF prints for `sos` is HALF the sum of squared residuals:
# it is the negative log-likelihood of unit-variance Gaussian noise up to the
# (n/2)log(2*pi) constant, which is how the AIC/BIC line is derived. Double it before
# comparing with the paper's SSE.
objective = sos

max_iterations = 400
population_size = 72
refine = 1

##################
### Parameters ###
##################
# Sec. IV-D: "To avoid overfitting, we considered the minimum reaction set of on and
# off-pathway. We chose the range of parameters carefully using the values estimated from
# the previous fit." The brackets below do that -- each spans the values the
# `micelle_addition` and `micelle_removal` jobs recovered, widened by a decade either side,
# so the global fit can reconcile them without being free to wander.

# On pathway, Eq. 4.
loguniform_var = k_nuon     1.25         138.148
loguniform_var = k_nuon_    0.860595     157.975
loguniform_var = k_fbon     0.405652     597.078
loguniform_var = k_fbon_    0.338666     43.4967

# Off pathway, Eq. 4-II.
loguniform_var = k_con      0.078518     274.09
loguniform_var = k_con_     0.039221     2053.21
loguniform_var = k_nuoff    6.25663      44275.7
loguniform_var = k_nuoff_   1.35701      30705.4
loguniform_var = k_fboff    0.047638     7.19779
loguniform_var = k_fboff_   0.00453553   131.923

# Pathway switching, Eq. 5.
loguniform_var = k_swi      59.8616      48869.9
loguniform_var = k_swi_     0.00839963   2.8192

# ThT mapping constants, a.u. per uM. map_off1 and map_off2 are Table I's k_off1 and
# k_off2; the paper varies its mapping constant freely over 10^0-10^5.
loguniform_var = map_on     0.137439     420.656
loguniform_var = map_off1   1e0          1e5
loguniform_var = map_off2   1e0          1e5
