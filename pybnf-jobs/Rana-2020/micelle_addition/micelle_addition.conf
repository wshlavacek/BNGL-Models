# Abeta42 pseudo-micelle addition event -- on-to-off pathway switching.
# Deterministic ODE (23 species, 80 reactions). Real-world PyBNF edition-2 fitting job
# derived from:
#   Rana P, Bose P, Vaidya A, Rangachari V, Ghosh P. "Global fitting and parameter
#   identifiability for amyloid-beta aggregation with competing pathways."
#   2020 IEEE 20th Int. Conf. on BioInformatics and BioEngineering (BIBE):73-78.
#   DOI: 10.1109/BIBE50027.2020.00020
#
# FIT TARGET: Sec. IV-B, "Parameter Estimation and Identifiability with the pseudo-micelle
#   addition Event (on-to-off pathway switching)". Rana et al. build a model "with events
#   at 3h and 24 h, which simulate the addition of pseudo-micelles and monomers", fit it to
#   three experiments, and report SSE 4.12 (Table I, On-Off Switching column: k_con,
#   k_fboff, k_nuoff, k_nuoff_, k_nuon, k_nuon_, k_off, k_swi). They find every parameter
#   identifiable except k_swi and k_con.
#
# DATA: 322 points from Fig. 1c -- 25 uM Abeta42 with 5 mM C12 fatty acid present
#   throughout (the off-pathway reference), and two samples that receive the fatty acid at
#   3 h and at 24 h while still in the on-pathway lag phase. The published caption labels
#   panel (b) the addition event and panel (c) the removal event, but the body text cites
#   Fig. 1c here ("the three experiments", SSE 4.12) and Fig. 1b in Sec. IV-C, and the
#   kinetics agree with the body text: the two switching traces of panel (c) are flat until
#   3 h and 24 h, which only a fatty acid-free sample can be. Rana et al. tabulate nothing,
#   so the traces were DIGITIZED by
#   models/amyloid_beta_competing_aggregation_pathways_rana2020/digitize_rana2020.py.
#   Rebuild the tables with make_exp.py.
#
# EXPERIMENTAL DESIGN: the addition event is a fixed-length pre-equilibration phase under
#   one condition followed by the measured phase under the other. `equil_t_end` makes the
#   first phase run for exactly 3 h (or 24 h) instead of solving for a steady state, which
#   is what a lag-phase sample needs -- this model has no steady state on that timescale.
#   State carries across the phase boundary (ADR-0052), so the measured phase starts from
#   the oligomer distribution the sample had reached when the fatty acid was added. The
#   measured phase restarts the clock at zero, so make_exp.py shifts the data by the event
#   time and drops the pre-event points; those points are the on-pathway experiment, which
#   is fit in its own right by the `on_pathway` and `global` jobs.
#
# Run (with BNGPATH set, from this folder):
#   cd pybnf-jobs/Rana-2020/micelle_addition && pybnf -c micelle_addition.conf

output_dir = output

edition = 2
bngl_backend = bngsim

model: micelle_addition.bngl

#######################
### General Options ###
#######################

delete_old_files = 1
verbosity = 2

##################
### Conditions ###
##################
# The fatty acid enters as a bolus onto the SPECIES Mic() -- a condition target containing
# '(' routes to setConcentration rather than setParameter, which is what a mid-protocol
# stimulus needs: setting a parameter that a seed species references would not change the
# amount already carried over from the pre-equilibration phase. 100 uM is the pseudo-
# micelle concentration formed by 5 mM C12 fatty acid at an aggregation number of 50; it
# is held fixed because while micelles are in excess only the product k_con*[L] is
# identifiable, and k_con absorbs it.
# A species amount can only be set inline inside a pre-equilibration protocol
# (ADR-0062): a bare `condition:` on a plain time course is a separate mutant simulation
# and PyBNF's PEtab export refuses it. The no-event control therefore carries its micelles
# in the model's seed species and needs no condition, and every condition below belongs to
# a pre-equilibrated experiment. For the same reason each role gets its own condition name
# -- one condition cannot serve both a pre-equilibrated and a standalone experiment
# (ADR-0052).
condition: no_fa_pre, perturbations: "Mic()" = 0
condition: fa_add,    perturbations: "Mic()" = 100

###################
### Observables ###
###################
# Rana et al. read the measured trace as signal_on + signal_off: the cross-beta-rich
# species are the on-pathway fibril F = A_12 and the lumped off-pathway 12-23mer F'_1.
# map_off is their mapping constant map' (Sec. IV-B) / k_off (Table I). Writing it as a
# measurement model rather than a `normalization` keeps the job PEtab-exportable.
observable: ThT, formula: map_on * Obs_F + map_off * Obs_Fp1

###################
### Experiments ###
###################
experiment: fa_control,   data: fa_control.exp
experiment: addition_3h,  preequilibrate: no_fa_pre, equil_t_end: 3,  condition: fa_add, data: addition_3h.exp
experiment: addition_24h, preequilibrate: no_fa_pre, equil_t_end: 24, condition: fa_add, data: addition_24h.exp

#######################
### Fitting Options ###
#######################

# Scatter search, as in the other three jobs: differential evolution at PyBNF's defaults
# converges prematurely on this landscape, and Rana et al.'s own optimizer benchmark
# (Table II) puts scatter search first on this model family.
job_type = ss

# Unweighted sum of squared error, the criterion Rana et al. report (SSE 4.12 for this
# fit). No per-point uncertainty is published, so there are no _SD columns. NOTE that the
# number PyBNF prints for `sos` is HALF the sum of squared residuals -- the negative
# log-likelihood of unit-variance Gaussian noise up to the (n/2)log(2*pi) constant, which
# is how the AIC/BIC line is derived. Double it before comparing with the paper's SSE.
objective = sos

max_iterations = 300
population_size = 60
refine = 1

##################
### Parameters ###
##################
# The search ranges follow the paper's own recipe for this step (Sec. IV-B): "the
# on-pathway rate constants are varied between 0.1-10 times of the estimated values from
# the previous on pathway fit, while all the off-pathway rate constants were varied freely
# from 10^-2 to 10^5 units. The parameter mapping constant map' is also varied freely from
# 10^0 to 10^5."

# On pathway: 0.1-10x the best fit recovered by the `on_pathway` job
# (k_nuon 3.6677, k_nuon_ 82.142, k_fbon 6.7244,
# k_fbon_ 9.9897, map_on 8.6693), exactly as Sec. IV-B prescribes
# relative to its own on-pathway fit.
loguniform_var = k_nuon    0.366768  36.6768
loguniform_var = k_nuon_   8.21423   821.423
loguniform_var = k_fbon    0.67244   67.244
loguniform_var = k_fbon_   0.998968  99.8968

# Off pathway, free over the paper's 10^-2 to 10^5. k_con carries units of /uM^4/h and the
# micelle pool is 100 uM, so its useful range sits low in that window; the bracket is kept
# as published.
loguniform_var = k_con     1e-2  1e5
loguniform_var = k_con_    1e-2  1e5
loguniform_var = k_nuoff   1e-2  1e5
loguniform_var = k_nuoff_  1e-2  1e5
loguniform_var = k_fboff   1e-2  1e5
loguniform_var = k_fboff_  1e-2  1e5

# Pathway switching, Eq. 5. Rana et al. fit k_swi (183.97 here) and find it NOT
# identifiable; k_swi_ is never tabulated.
loguniform_var = k_swi     1e-2  1e5
loguniform_var = k_swi_    1e-2  1e5

# ThT mapping constants, a.u. per uM. map_on rides with the on-pathway block; map_off is
# the paper's freely varied map' / k_off.
loguniform_var = map_on    0.866927  86.6927
loguniform_var = map_off   1e0   1e5
