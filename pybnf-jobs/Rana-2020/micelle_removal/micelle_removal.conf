# Abeta42 pseudo-micelle removal event -- off-to-on pathway switching.
# Deterministic ODE (23 species, 80 reactions). Real-world PyBNF edition-2 fitting job
# derived from:
#   Rana P, Bose P, Vaidya A, Rangachari V, Ghosh P. "Global fitting and parameter
#   identifiability for amyloid-beta aggregation with competing pathways."
#   2020 IEEE 20th Int. Conf. on BioInformatics and BioEngineering (BIBE):73-78.
#   DOI: 10.1109/BIBE50027.2020.00020
#
# FIT TARGET: Sec. IV-C, "Parameter Estimation and Identifiability with pseudo-micelle
#   removal event (off-to-on switching)". Rana et al. "built the COPASI model with all off
#   and on pathway reactions" and "defined an event to simulate micelle removal from the
#   system along with monomer addition", report SSE 1.22, and find EVERY parameter of this
#   fit identifiable (Table I, Off-On Switching column, all bold: k_con, k_fboff, k_nuoff,
#   k_nuoff_, k_nuon, k_nuon_, k_off, k_swi). It is the best-determined of the paper's four
#   fits and therefore the most useful recovery target.
#
# DATA: 120 points from Fig. 1b -- 25 uM Abeta42 with 5 mM C12 fatty acid present from
#   t = 0 in all three samples, two of which are diluted at 5 h and at 24 h to bring the
#   fatty acid below its critical micelle concentration. Every trace rises without a lag,
#   which is what identifies this panel as the removal experiment despite the published
#   caption (the body text cites Fig. 1b here and Fig. 1c in Sec. IV-B; see make_exp.py).
#   Rana et al. tabulate nothing, so the traces were DIGITIZED by
#   models/amyloid_beta_competing_aggregation_pathways_rana2020/digitize_rana2020.py.
#   Rebuild the tables with make_exp.py.
#   The undiluted control resolves only after 24.8 h: before that it runs underneath the
#   dilute-at-24h sample, which is the same material, and the colour separation cannot
#   assign the occluded pixels. Those points are not lost to the fit -- they are the
#   dilute-at-24h sample's own pre-event trace.
#
# EXPERIMENTAL DESIGN: dilution is a fixed-length pre-equilibration phase with fatty acid
#   followed by the measured phase without it. `equil_t_end` makes the first phase run for
#   exactly 5 h (or 24 h) rather than solving for a steady state, and state carries across
#   the boundary (ADR-0052), so the measured phase starts from the off-pathway oligomer
#   distribution the sample had actually reached. Rana et al. also add monomer at the
#   event; the amount is not reported, and since a 5-10x dilution removes the same fraction
#   of peptide that the added monomer restores, the peptide pool is simply carried through
#   unchanged here. The measured phase restarts the clock, so make_exp.py shifts the times.
#
# Run (with BNGPATH set, from this folder):
#   cd pybnf-jobs/Rana-2020/micelle_removal && pybnf -c micelle_removal.conf

output_dir = output

edition = 2
bngl_backend = bngsim

model: micelle_removal.bngl

#######################
### General Options ###
#######################

delete_old_files = 1
verbosity = 2

##################
### Conditions ###
##################
# The fatty acid enters and leaves as a bolus onto the SPECIES Mic() -- a condition target
# containing '(' routes to setConcentration rather than setParameter, which is what a
# mid-protocol change needs: setting a parameter that a seed species references would not
# change the amount already carried over from the pre-equilibration phase. 100 uM is the
# pseudo-micelle concentration formed by 5 mM C12 fatty acid at an aggregation number of
# 50; it is held fixed because while micelles are in excess only the product k_con*[L] is
# identifiable, and k_con absorbs it.
# A species amount can only be set inline inside a pre-equilibration protocol
# (ADR-0062): a bare `condition:` on a plain time course is a separate mutant simulation
# and PyBNF's PEtab export refuses it. The no-event control therefore carries its micelles
# in the model's seed species and needs no condition, and every condition below belongs to
# a pre-equilibrated experiment. For the same reason each role gets its own condition name
# -- one condition cannot serve both a pre-equilibrated and a standalone experiment
# (ADR-0052).
condition: fa_pre,      perturbations: "Mic()" = 100
condition: no_fa_post,  perturbations: "Mic()" = 0

###################
### Observables ###
###################
# Rana et al. read the measured trace as signal_on + signal_off: the cross-beta-rich
# species are the on-pathway fibril F = A_12 and the lumped off-pathway 12-23mer F'_1.
# map_off is their mapping constant map' / k_off (Table I). Writing it as a measurement
# model rather than a `normalization` keeps the job PEtab-exportable.
observable: ThT, formula: map_on * Obs_F + map_off * Obs_Fp1

###################
### Experiments ###
###################
experiment: fa_control,  data: fa_control.exp
experiment: removal_5h,  preequilibrate: fa_pre, equil_t_end: 5,  condition: no_fa_post, data: removal_5h.exp
experiment: removal_24h, preequilibrate: fa_pre, equil_t_end: 24, condition: no_fa_post, data: removal_24h.exp

#######################
### Fitting Options ###
#######################

job_type = ss

# Unweighted sum of squared error, the criterion Rana et al. report (SSE 1.22 for this
# fit). No per-point uncertainty is published, so there are no _SD columns. NOTE that the
# number PyBNF prints for `sos` is HALF the sum of squared residuals -- it is the
# negative log-likelihood of unit-variance Gaussian noise up to the (n/2)log(2*pi)
# constant, which is how the AIC/BIC line is derived. Double it before comparing with the
# paper's SSE.
objective = sos

max_iterations = 300
population_size = 60
refine = 1

##################
### Parameters ###
##################
# Same recipe as the addition job and as Sec. IV-B: on-pathway constants bracketed at
# 0.1-10x the `on_pathway` job's best fit, off-pathway constants and the mapping constant
# free over the paper's own windows (10^-2..10^5 and 10^0..10^5).

# On pathway, 0.1-10x the `on_pathway` best fit.
loguniform_var = k_nuon    0.366768  36.6768
loguniform_var = k_nuon_   8.21423 821.423
loguniform_var = k_fbon    0.67244  67.244
loguniform_var = k_fbon_   0.998968 99.8968

# Off pathway, free over the paper's 10^-2 to 10^5.
loguniform_var = k_con     1e-2  1e5
loguniform_var = k_con_    1e-2  1e5
loguniform_var = k_nuoff   1e-2  1e5
loguniform_var = k_nuoff_  1e-2  1e5
loguniform_var = k_fboff   1e-2  1e5
loguniform_var = k_fboff_  1e-2  1e5

# Pathway switching, Eq. 5. Rana et al. report k_swi = 0.1 /h here and mark it
# identifiable -- the only column in which it is.
loguniform_var = k_swi     1e-2  1e5
loguniform_var = k_swi_    1e-2  1e5

# ThT mapping constants, a.u. per uM.
loguniform_var = map_on    0.866927   86.6927
loguniform_var = map_off   1e0   1e5
