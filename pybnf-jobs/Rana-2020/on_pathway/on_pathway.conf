# Abeta42 on-pathway aggregation -- the fatty acid-free ThT time course.
# Deterministic ODE (12 species, 44 reactions). Real-world PyBNF edition-2 fitting job
# derived from:
#   Rana P, Bose P, Vaidya A, Rangachari V, Ghosh P. "Global fitting and parameter
#   identifiability for amyloid-beta aggregation with competing pathways."
#   2020 IEEE 20th Int. Conf. on BioInformatics and BioEngineering (BIBE):73-78.
#   DOI: 10.1109/BIBE50027.2020.00020
#
# FIT TARGET: the four on-pathway rate constants of Eq. 4 -- k_nuon, k_nuon_, k_fbon,
#   k_fbon_ -- plus the ThT mapping constant. This is the paper's own first step:
#   "First, we fitted the experimental data of the on-pathway, considering the reactions
#   in Eq. 4. These estimated on-pathway parameters were used to define the parameter
#   ranges in the subsequent steps" (Sec. IV-A). Rana et al. report SSE 0.13 for it and
#   tabulate k_nuon = 22.04 /uM/h and k_nuon_ = 12.72 /h (Table I, On-Pathway column);
#   k_fbon and k_fbon_ are never tabulated, only described as k_fb ~ 400*k_nu and
#   k_fb_ ~ k_fb/100..200 (Sec. IV-A).
#
# DATA: 97 points, Fig. 1a, 25 uM Abeta42 with no fatty acid, 0-48 h. Rana et al. tabulate
#   nothing, so the trace was DIGITIZED from the publisher PDF by
#   models/amyloid_beta_competing_aggregation_pathways_rana2020/digitize_rana2020.py
#   (600 dpi raster, ink-vector colour separation, 0.5 h bins). Rebuild with make_exp.py.
#   Digitization uncertainty is the half-height of the marker cloud in each bin, median
#   0.019 ThT a.u.; it is recorded in the committed CSV but not written as an _SD column,
#   because Rana et al. score with an unweighted sum of squared error and `sos` is what
#   makes the objective here comparable with their reported SSE.
#
# WHY THE PUBLISHED VALUES ARE NOT THE NOMINALS: at the 25 uM peptide concentration the
#   paper states, k_nuon = 22.04 /uM/h against k_nuon_ = 12.72 /h makes every step of the
#   nucleation chain thermodynamically downhill (K*[A_1] = 43), so A_1..A_12 reach
#   equilibrium within ~0.03 h. Nothing in the model is then slow, and no lag phase is
#   possible -- yet Fig. 1a lags ~28 h. The nominals below are this job's own best fit;
#   see README.md for the side-by-side with Table I.
#
# Run (with BNGPATH set, from this folder):
#   cd pybnf-jobs/Rana-2020/on_pathway && pybnf -c on_pathway.conf

output_dir = output

edition = 2
bngl_backend = bngsim

model: on_pathway.bngl

#######################
### General Options ###
#######################

delete_old_files = 1
verbosity = 2

###################
### Observables ###
###################
# Rana et al. read the measured trace as signal_on + signal_off. This experiment has no
# fatty acid, so the off-pathway reactions of Eq. 4-II are absent from the model and only
# the on-pathway fibril F = A_12 contributes. map_on is the on-pathway counterpart of the
# mapping constant map' that Sec. IV-B varies freely over 10^0-10^5; expressing it as a
# measurement model rather than a `normalization` keeps the job PEtab-exportable.
observable: ThT, formula: map_on * Obs_F

###################
### Experiments ###
###################
experiment: on_pathway, data: on_pathway.exp

#######################
### Fitting Options ###
#######################

# Scatter search. Rana et al. benchmark fourteen COPASI optimizers on this model family
# (Table II) and scatter search is the only one that fits their global problem; it is much
# the better choice here too. Differential evolution at PyBNF's defaults converges
# prematurely on this landscape -- 178 generations at population 48 left the whole
# population between 0.4145 and 0.4207, while the best known optimum is 0.0108.
job_type = ss

# Unweighted sum of squared error, which is the criterion Rana et al. report (SSE 0.13 for
# this fit). No per-point uncertainty is published, so there are no _SD columns and chi_sq
# would have nothing to weight with.
#
# NOTE: the number PyBNF prints and stores for `objective = sos` is HALF the sum of squared
# residuals. It is the negative log-likelihood of unit-variance Gaussian noise up to the
# (n/2)*log(2*pi) constant -- which is how the run's AIC/BIC line is derived, and is
# reproducible on a three-point control (y = 1, 2, 3 against a zero prediction reports 7.0,
# not 14.0). DOUBLE the reported objective before comparing it with the paper's SSE.
objective = sos

max_iterations = 250
population_size = 48
refine = 1

##################
### Parameters ###
##################
# Four rate constants and one mapping constant, all log-scaled. The brackets are wide
# because two of the four (k_fbon, k_fbon_) have no published value at all, and because
# the published values of the other two are ruled out by the lag-phase argument in the
# header. They span the tabulated On-Pathway values (22.04, 12.72) so the fit can return
# to them if the data support it.

# Nucleation by monomer addition, A_i + A_1 <-> A_i+1 (flux H_i).
loguniform_var = k_nuon    1e-3  1e2
loguniform_var = k_nuon_   1e-3  1e3

# Fibril binding, A_i + F <-> F (flux I_i).
loguniform_var = k_fbon    1e-3  1e3
loguniform_var = k_fbon_   1e-4  1e3

# ThT mapping constant, a.u. per uM of fibril.
loguniform_var = map_on    1e-2  1e3
