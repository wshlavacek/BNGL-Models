# =====================================================================================
# CD3zeta site-specific phosphorylation by LCK (Rohrs et al. 2018) -- edition-2 PyBNF
# fit of the competitive inhibition mechanism to nine phosphoproteomic time courses.
# ODE; the paper's headline parameter-estimation problem (Figs. 3D and 4).
#
# Real-world PyBNF edition-2 fitting job derived from:
#   Rohrs JA, Zheng D, Graham NA, Wang P, Finley SD. "Computational model of chimeric
#   antigen receptors explains site-specific phosphorylation kinetics."
#   Biophys J 2018; 115(7):1116-1129.  DOI 10.1016/j.bpj.2018.08.018.  PMCID PMC6199440.
#   Mechanism and rate law: Eqs. 4 and 5.  Authors' BioNetGen model: Data S4 (mmc5.pdf).
#
# Fit target -- percent phosphorylation of the six CD3zeta ITAM tyrosines, measured by
#   phosphoproteomic mass spectrometry on liposome-bound recombinant protein, over nine
#   experimental conditions and 354 points:
#     wt_10pops_rep2.exp   wild-type CD3zeta, 10% POPS liposomes (2nd biological rep)
#     wt_0pops.exp         wild-type CD3zeta, 0% POPS liposomes
#     wt_45pops.exp        wild-type CD3zeta, 45% POPS liposomes
#     mut_{A1,A2,B1,B2,C1,C2}.exp   the six tyrosine-to-phenylalanine ITAM point mutants
#   All nine come from Fig. S5, A-J, digitized vertex by vertex from the vector figure by
#   models/car_cd3zeta_phosphorylation_rohrs2018/digitize_rohrs2018.py.  Fig. 1C, the
#   first wild-type replicate the authors also fit, is raster and is not included, so this
#   job fits nine of their ten data sets.
#
# Mutants are Conditions, not separate models: each ITAM tyrosine carries a 0/1 gate
#   parameter live_<site> in the model, and setting it to zero removes that site from both
#   the substrate and the inhibitor sums of Eq. 4 -- exactly what a Y->F substitution does.
#   The mutated site's column is NaN in its own .exp and is skipped in scoring.
#
# Objective: sos.  The paper scores with the sum of squared error (Materials and Methods,
#   "Comparison of model structures") and reports 3.47e4 for this mechanism over all ten
#   data sets, so no _SD columns are supplied and the PyBNF objective is the same quantity.
#
# Free parameters (7), following the paper's own protocol exactly: the total LCK density,
#   five of the six Michaelis constants, and the single inhibition scale factor X_I.
#   k_cat is held at 360/min (the Hui and Vale 2014 value) and K_M,B1 at 270/um^2, because
#   k_cat and LCK are correlated and the six K_M vary together.  Ranges are the paper's:
#   "two orders of magnitude up and down from their baseline values (LCK = 60
#   molecules/um^2, K_M,i = 270 molecules/um^2, and X_I = 1)".
#
# Run (with BNGPATH set, from this folder):
#   cd pybnf-jobs/Rohrs-2018/cd3zeta_competitive_inhibition && pybnf -c cd3zeta_competitive_inhibition.conf
# =====================================================================================

output_dir = output

# Opt into the edition-2 config language (PEtab-aligned experiment:/condition:).
edition = 2

# In-process bngsim backend (the new-era default).
bngl_backend = bngsim

# The model. No actions block: the nine time courses are synthesized from the
# experiment: lines below, and the 65-species network is bounded by the rules
# themselves, so no generate_network directive has to be retained.
model: cd3zeta_competitive_inhibition.bngl

#######################
### General Options ###
#######################

delete_old_files = 1
verbosity = 1

# A single ODE run over this 65-species network is milliseconds; cull pathological
# parameter sets quickly rather than letting them grind against the 3600 s default.
wall_time_sim = 60
max_failed_simulations = 10000

#######################
### Fitting Options ###
#######################

# Differential evolution. The paper used particle swarm (PSO); `pso` is available and
# gives comparable results here, but `de` is the corpus workhorse and is more robust
# over the four-decade log ranges below. Local polish with the default simplex.
job_type = de

# Plain sum of squares -- the paper's own SSE, and inside the PEtab-exportable subset.
objective = sos

population_size = 40
max_iterations = 300
refine = 1

##################
### Conditions ###
##################
# One Condition per tyrosine-to-phenylalanine point mutant. Setting a gate to zero makes
# that site neither a substrate nor a competitor for LCK, which is what the ~F state of
# models/car_cd3zeta_phosphorylation_rohrs2018_mutants.bngl encodes structurally. The
# wild-type experiments take no condition, so all six gates stay at their nominal 1.

condition: mutA1, perturbations: live_A1 = 0
condition: mutA2, perturbations: live_A2 = 0
condition: mutB1, perturbations: live_B1 = 0
condition: mutB2, perturbations: live_B2 = 0
condition: mutC1, perturbations: live_C1 = 0
condition: mutC2, perturbations: live_C2 = 0

###################
### Experiments ###
###################
# Nine time courses. The first .exp column is `time`, so each is inferred as a time
# course and the simulation outputs at exactly the measured times. Rohrs et al. found no
# effect of acidic lipid content between 0% and 45% POPS, so the three wild-type lipid
# conditions share one model state and differ only in their sampling times and data.

experiment: wt_10pops_rep2, data: wt_10pops_rep2.exp
experiment: wt_0pops, data: wt_0pops.exp
experiment: wt_45pops, data: wt_45pops.exp
experiment: mut_A1, condition: mutA1, data: mut_A1.exp
experiment: mut_A2, condition: mutA2, data: mut_A2.exp
experiment: mut_B1, condition: mutB1, data: mut_B1.exp
experiment: mut_B2, condition: mutB2, data: mut_B2.exp
experiment: mut_C1, condition: mutC1, data: mut_C1.exp
experiment: mut_C2, condition: mutC2, data: mut_C2.exp

##################
### Parameters ###
##################
# Seven free parameters bound to model ids BY NAME (ADR-0034, no __FREE alias), searched
# on a log10 scale over the paper's stated two-orders-of-magnitude window around its
# stated baselines. The reported best fit of Data S4 -- LCK_T 19.703, K_M,A1 96.548,
# K_M,A2 331.68, K_M,B2 153.82, K_M,C1 484.9, K_M,C2 405.43, X_I 0.1153 -- lies inside
# every range and is the recovery target.

# Total LCK density; baseline 60 molecules/um^2 (the experimental estimate)
loguniform_var = LCK_T 0.6 6000

# Michaelis constants; baseline 270 molecules/um^2 (K_M,B1 is held there, not fitted)
loguniform_var = KmA1 2.7 27000
loguniform_var = KmA2 2.7 27000
loguniform_var = KmB2 2.7 27000
loguniform_var = KmC1 2.7 27000
loguniform_var = KmC2 2.7 27000

# Single scale factor relating every inhibition constant to its Michaelis constant
loguniform_var = Xi 0.01 100
