# =====================================================================================
# Objective at the authors' published parameters -- the reference point every fit of
# cd3zeta_competitive_inhibition.conf is measured against.
#
# Same model, data, conditions and objective as the fitting job; the only differences are
# that the seven parameters are pinned at the Data S4 (mmc5.pdf) best fit with `var`
# instead of searched, and the budget is one evaluation. PyBNF prints
#
#   Stop criterion satisfied with objective function value of 6253.576261269218
#
# NOTE the factor of two: PyBNF's `sos` is the Gaussian negative log-likelihood at sigma=1,
# i.e. HALF the sum of squared error, so this objective corresponds to SSE = 1.2507e4 over
# the 312 scored points -- the quantity make_reproduction.py prints (1.253e4; the 0.2%
# difference is that the script interpolates the model onto the data times while PyBNF
# simulates at them exactly), and the same quantity Rohrs et al. report as 3.47e4 over all
# ten of their data sets, of which this job fits nine.
#
# Run (with BNGPATH set, from this folder):
#   pybnf -c nominal_check.conf
# =====================================================================================

output_dir = output_nominal_check

edition = 2
bngl_backend = bngsim

model: cd3zeta_competitive_inhibition.bngl

delete_old_files = 1
verbosity = 1
wall_time_sim = 60
max_failed_simulations = 10000

# One simplex evaluation from the pinned start point.
job_type = sim
objective = sos
population_size = 1
max_iterations = 1
simplex_max_iterations = 1

condition: mutA1, perturbations: live_A1 = 0
condition: mutA2, perturbations: live_A2 = 0
condition: mutB1, perturbations: live_B1 = 0
condition: mutB2, perturbations: live_B2 = 0
condition: mutC1, perturbations: live_C1 = 0
condition: mutC2, perturbations: live_C2 = 0

experiment: wt_10pops_rep2, data: wt_10pops_rep2.exp
experiment: wt_0pops, data: wt_0pops.exp
experiment: wt_45pops, data: wt_45pops.exp
experiment: mut_A1, condition: mutA1, data: mut_A1.exp
experiment: mut_A2, condition: mutA2, data: mut_A2.exp
experiment: mut_B1, condition: mutB1, data: mut_B1.exp
experiment: mut_B2, condition: mutB2, data: mut_B2.exp
experiment: mut_C1, condition: mutC1, data: mut_C1.exp
experiment: mut_C2, condition: mutC2, data: mut_C2.exp

# The reported best fit for the competitive inhibition mechanism (Data S4).
var = LCK_T 19.703
var = KmA1 96.548
var = KmA2 331.68
var = KmB2 153.82
var = KmC1 484.9
var = KmC2 405.43
var = Xi 0.1153
