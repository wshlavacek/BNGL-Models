# =====================================================================================
# Mitochondrial MT1 cAMP signaling (Suofu et al. 2017) -- edition-2 PyBNF refit of the
# twelve rate constants of Supplementary Data Table 1, plus the PM/OMM MT1 concentration
# ratio, to the averaged cAMP time courses of Fig. 4H (melatonin) and Fig. 4I (DAMGO).
#
# Real-world PyBNF edition-2 fitting job derived from:
#   Suofu Y, Li W, Jean-Alphonse FG, Jia J, Khattar NK, Li J, Baranov SV, Leronni D,
#   Mihalik AC, He Y, et al. "Dual role of mitochondria in producing melatonin and
#   driving GPCR signaling to block cytochrome c release." Proc Natl Acad Sci USA 2017;
#   114:E7997-E8006. DOI 10.1073/pnas.1705768114. PMCID PMC5617291.
#   Model = SI Appendix "Model constructions and analysis" + Supplementary Data Table 1
#   (eight reaction types, twelve rate constants) + Supplementary Data Table 2 (initial
#   quantities); fit targets = Fig. 4H and Fig. 4I; the authors' own fit of the same
#   model to the same data is plotted in Fig. 4J and summarized as MCMC posteriors in
#   Supplementary Data Fig. S7.
#
# WHY THIS JOB EXISTS. Suofu et al. (2017) fit this model by replica-exchange MCMC
#   (eight chains, 10,000 swaps) and report the result only as log10 posterior histograms
#   (Supplementary Data Fig. S7) -- no table of values, and no statement of the unit
#   convention behind them, so the histograms cannot be read back into a runnable model.
#   Three of the twelve posteriors (k1f, k3f, kdiff) are spikes pinned against the lower
#   edge of their priors and four more (k3r, k4, k5, k6) are broadly bimodal across their
#   whole prior box, so the published fit is also not a point estimate in any useful
#   sense. This job refits the same twelve constants -- in stated units -- to the same
#   two figures, and is what parameterizes the library model in
#   models/mitochondrial_mt1_camp_signaling_suofu2017/. See VALIDATION.md.
#
# EXPERIMENTAL DESIGN -- two saturating-agonist stimulations of forskolin-treated N2a
#   cells, both starting from the same receptor-silent steady state:
#       experiment   receptor       PM copies        OMM copies    condition
#       melatonin    MT1            1e6*ratio_MT1    1e6*phi       MT1_isActive = 1
#       damgo        mu-OR          1e6              0             OR_isActive  = 1
#   Both are preceded by `preequilibrate: basal`, which is the paper's own protocol:
#   "the model was executed in the absence of MT1 and mu-OR until steady state was
#   reached", after which the receptors are switched on. A saturating agonist is modeled
#   as the paper models it -- by making the receptor competent to load Gi -- rather than
#   by simulating ligand binding.
#
# FIT DATA -- the averaged single-cell FRET traces of Fig. 4H (melatonin, n = 15-40
#   cells) and Fig. 4I (DAMGO), each reported as cAMP in percent of its pre-agonist
#   maximum, for a plasma-membrane sensor (model observable camp_CY_pct(), cytosolic
#   cAMP) and an outer-mitochondrial-membrane sensor (camp_ML_pct(), luminal cAMP).
#   77 points in all: 29 PM + 19 OMM for melatonin, 19 PM + 10 OMM for DAMGO. Extraction
#   is documented and reproducible in the library model's verify_suofu2017.ipynb: page 5
#   of the article rendered at 1200 dpi, axis calibration from the plotted ticks, marker
#   centres by matched filtering with an 16 px disk and greedy peak picking (the markers
#   overlap both each other and the plotted mono-exponential fit, so a connected-
#   component centroid does not resolve them). The digitized data is archived as
#   reference/suofu2017_fig4HI_camp_timecourses_digitized.csv there.
#
# NO SCALING PARAMETER. The data are relative (percent of the pre-agonist maximum), but
#   the observables are absolute: cAMP as a percentage of the Supplementary Data Table 2
#   basal quantity (1.0e7 cytosolic, 1.0e7*phi luminal). Fixing the reference that way
#   instead of adding a free scale, or `normalization = init`, keeps the job inside the
#   PEtab-exportable subset AND imposes the physiological constraint the authors' Table 2
#   asserts: the receptor-silent steady state has to land on the tabulated cAMP level,
#   because the data's first points are near 100%.
#
# Run (with BNGPATH set, from this folder):
#   cd pybnf-jobs/Suofu-2017/mito_camp && pybnf -c mito_camp.conf
#   python make_reproduction.py
# =====================================================================================

output_dir = output

# Opt into the edition-2 config language (PEtab-aligned condition:/experiment:).
edition = 2

# In-process bngsim backend (the new-era default).
bngl_backend = bngsim

model: mito_camp.bngl

#######################
### General Options ###
#######################

delete_old_files = 1
verbosity = 1

# 26 species / 30 reactions; a trial is milliseconds. But a trial that makes the
# AMP -> ATP recycling step very slow makes the basal steady-state solve stiff, so cap
# the per-simulation wall time rather than waiting out the 3600 s default.
wall_time_sim = 60
max_failed_simulations = 500

#######################
### Fitting Options ###
#######################

# Differential evolution -- a global metaheuristic. The closest edition-2 analog of the
# authors' parallel-tempering MCMC would be job_type = pt, but the deliverable here is a
# point estimate that parameterizes the library model, not a posterior, and the landscape
# is badly multimodal: several of the authors' own posteriors are bimodal across a whole
# prior decade box.
job_type = de

population_size = 130
max_iterations = 300

# Fig. 4H/4I report mean +- SEM, but the error bars overlap so densely in the plateau
# region that per-point SEMs cannot be digitized reliably; plain sum of squares. PyBNF
# reports sos as half the residual sum of squares.
objective = sos

###################
### Conditions  ###
###################
# `basal` is the receptor-silent state the model is equilibrated in; it restates the
# model nominals so that the pre-equilibration is explicit rather than implied.

condition: basal,     perturbations: MT1_isActive = 0, OR_isActive = 0
condition: melatonin, perturbations: MT1_isActive = 1, OR_isActive = 0
condition: damgo,     perturbations: MT1_isActive = 0, OR_isActive = 1

###################
### Experiments ###
###################

experiment: melatonin, preequilibrate: basal, condition: melatonin, data: melatonin.exp
experiment: damgo,     preequilibrate: basal, condition: damgo,     data: damgo.exp

##################
### Parameters ###
##################
# FOURTEEN free parameters, bound to the model ids BY NAME (ADR-0034, no __FREE alias):
# the twelve rate constants named in Supplementary Data Table 1 of Suofu et al. (2017),
# the one non-kinetic free parameter the SI Appendix names (the PM/OMM MT1 concentration
# ratio), and MT1_OMM_amp, which resolves a contradiction in the paper: Supplementary
# Data Table 2 puts 1.13e4 MT1 on the OMM (= 1e6*phi, the same CONCENTRATION as the
# 1e6-copy PM) while the SI Appendix text specifies "2068 MT1 per square um of OMM"
# (= 2.34e5 copies, the same AREAL DENSITY as that PM) -- a 20.68-fold disagreement.
# MT1_OMM_amp is boxed between the two readings, so the fit chooses one.
#
#   id         box                units                 reaction
#   k1f        1e-11 .. 1e-4      um^3/molecule/s       1. ATP + AC
#   k1r        1e-4  .. 1e3       /s                    1. reverse
#   k2         1e-4  .. 1e3       /s                    2. AC.ATP -> AC + cAMP
#   k3f        1e-10 .. 1e-2      um^3/molecule/s       3. cAMP + PDE
#   k3r        1e-4  .. 1e3       /s                    3. reverse
#   k4         1e-3  .. 1e4       /s                    4. PDE.cAMP -> PDE + AMP
#   k5         1e-5  .. 1e2       /s                    5. AMP -> ATP
#   k6         1e-11 .. 1e-2      um^3/molecule/s       6. receptor + Gi
#   k7         1e-3  .. 1e4       /s                    7. R.Gi -> R + Gi*
#   k8f        1e-9  .. 1e0       um^3/molecule/s       8. AC + Gi*
#   k8r        1e-4  .. 1e4       /s                    8. reverse
#   kdiff      1e-5  .. 1e1       /s                    nucleotide efflux across the OMM
#   ratio_MT1  1e-3  .. 1         dimensionless         [MT1_PM]/(1e6/V_cy)
#   MT1_OMM_amp 1    .. 20.68     dimensionless         Table 2 vs SI-text OMM MT1
#
# Boxes are the paper's own prior boxes (the red outlines of Supplementary Data Fig. S7)
# widened by a decade or so at each end, shifted into the um^3-per-molecule convention
# used here. They are wide because the authors' unit convention is unstated, so the
# published posterior modes cannot be mapped onto these ids; `de` samples the whole box,
# so a wide box costs iterations, not correctness. k5 is floored at 1e-5 /s to keep the
# receptor-silent steady-state solve from becoming arbitrarily stiff.
loguniform_var = k1f       1e-11 1e-4
loguniform_var = k1r       1e-4  1e3
loguniform_var = k2        1e-4  1e3
loguniform_var = k3f       1e-10 1e-2
loguniform_var = k3r       1e-4  1e3
loguniform_var = k4        1e-3  1e4
loguniform_var = k5        1e-5  1e2
loguniform_var = k6        1e-11 1e-2
loguniform_var = k7        1e-3  1e4
loguniform_var = k8f       1e-9  1e0
loguniform_var = k8r       1e-4  1e4
loguniform_var = kdiff     1e-5  1e1
loguniform_var = ratio_MT1 1e-3  1
loguniform_var = MT1_OMM_amp 1 20.68
