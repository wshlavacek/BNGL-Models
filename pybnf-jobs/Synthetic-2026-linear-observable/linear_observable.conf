# A linear-Gaussian fit carrying a genuine coupled (scale, offset) pair.
#
# Built for the lanl/PyBNF#572 evaluation (PyBNF ADR-0123). That evaluation could not
# measure the case #572 is actually about -- variable projection over `Phi = [s, 1]` --
# because every coupled pair in the Grein subset-I corpus scores on a LOG residual, where
# the construction does not hold. This fixture is the missing case: an ordinary additive
# Gaussian, an observable that is exactly `scale * s + offset`, and both coefficients
# declared as free parameters.
#
# NOT a published model and not a benchmark. Its only job is to let the landscape question
# be asked in the construction's own domain.
#
#   truth:  k1 = 0.8   k2 = 0.25   scale = 3.0   offset = 1.5   sigma = 0.05
#
# `scale`, `offset` and `sigma` are deliberately absent from the SBML: they live only in the
# observable formula and the noise model, exactly as they do in the imported PEtab slugs.
#
# Two properties worth knowing before reading any result off this fixture:
#
#  * `offset` is a `uniform_var` on the REAL LINE, not a positive `loguniform_var`. On a
#    linear-scale family the least-squares optimum for an intercept need not be positive,
#    and a positive-only declaration would quietly turn the profile into a bounded search --
#    which is the thing being measured. The corpus's own offsets are all loguniform, which
#    is a PEtab-import artefact rather than a modelling choice.
#
#  * The fit has TWO global optima. Swapping k1 and k2 multiplies B by k2/k1, which a free
#    `scale` absorbs exactly (verified to 2.2e-16 by make_data.py). So k1 = 0.25, k2 = 0.8,
#    scale = 9.6 is the same curve, and a run reporting it has not failed. This is ordinary
#    identifiability structure, kept rather than engineered away.

edition = 2
model: model_linear_observable.xml

job_type = cmaes
population_size = 24
max_iterations = 500
verbosity = 1
sbml_backend = bngsim
random_seed = 1
output_dir = output

noise_model = gaussian, sigma = fit sigma
observable: y, formula: B*scale + offset

experiment: experiment1, method: ode, data: experiment1.exp

loguniform_var = k1 1e-3 1e3
loguniform_var = k2 1e-3 1e3
loguniform_var = scale 1e-3 1e3
uniform_var = offset -5 10
loguniform_var = sigma 1e-4 1e2
