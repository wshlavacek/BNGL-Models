# =============================================================================
#  MARGINAL fit -- integrate the latent measurement time out (phase-2 GRADIENT)
# =============================================================================
#  Vanhoefer et al. (bioRxiv 2026.05.09.724053), Fig 5/6, on the Bruno et al. 2016
#  carotenoid-cleavage model. The SAME data as standard.conf (sigmaT5/), but the
#  reported time t_k is treated as an UNCERTAIN version of the true sampling time
#  tau_k ~ TruncNormal(t_k, sigma_t). Each datum's likelihood is INTEGRATED over
#  tau_k rather than scored at t_k:
#
#      z_k = integral over [t0, tmax] of  N(ybar_k | x(tau, theta), sigma_k) p(tau | t_k) d tau
#
#  so the fit accounts for the timing spread instead of blaming it on the dynamics.
#  It recovers theta* (the standard fit does not) and ESTIMATES sigma_t (tracking
#  the injected 5 min), the paper's Fig 6A/B effect.
#
#  PHASE 2 (PyBNF ADR-0113): this is fit by a GRADIENT method. PyBNF assembles
#  dz_k/dtheta by chaining the forward-sensitivity tensor it already stores
#  (dx(tau)/dtheta at every grid node) through the same quadrature the value uses --
#  NO augmented ODE. job_type = gntr (the Fisher/Gauss-Newton trust region, whose
#  curvature for the marginal objective is the per-datum-score outer product) is used
#  here: its trust region keeps the first step bounded on this steep 13-parameter
#  surface. job_type = lbfgs consumes the same scalar gradient and is validated on the
#  tutorial, but on this stiff a start it can overshoot to a box edge -- warm-start it
#  or use gntr. Phase 1 refused every gradient job_type; only trf/hmc/ms remain refused
#  (see the PyBNF ADR).
#
#  Because a marginalized datum matches no single simulated row, each experiment is
#  simulated on a DENSE grid over the support [0, t_end]: t_end: 200 (> the last data
#  point at 180, so the timing prior is not hard-truncated) and n_steps: 200 (the
#  quadrature resolution; ~1 min spacing resolves sigma_t = 5). The gradient path
#  reads sensitivities at these same nodes.
#
#  Data:  sigmaT5/  (point at sigmaT0/ for the no-false-positive control).
#        pybnf -c marginal.conf
# -----------------------------------------------------------------------------
output_dir = output/marginal

edition = 2
model: model_carotenoid.xml
sbml_backend = bngsim

job_type = gntr
population_size = 20
max_iterations = 300
wall_time_sim = 10
random_seed = 1
verbosity = 1

condition: model1_data1, perturbations: init_b10 = init_b10_1, init_bcar = 0, init_bcry = 0, init_ohb10 = 0, init_zea = 0, k5_multiplier = 0, kb1_multiplier = 0, kb2_multiplier = 1, kc1_multiplier = 1, kc2_multiplier = 0, kc4_multiplier = 1
condition: model1_data2, perturbations: init_b10 = 0, init_bcar = init_bcar1, init_bcry = 0, init_ohb10 = 0, init_zea = 0, k5_multiplier = 1, kb1_multiplier = 1, kb2_multiplier = 1, kc1_multiplier = 0, kc2_multiplier = 0, kc4_multiplier = 0
condition: model1_data3, perturbations: init_b10 = 0, init_bcar = init_bcar2, init_bcry = 0, init_ohb10 = 0, init_zea = 0, k5_multiplier = szea, kb1_multiplier = szea, kb2_multiplier = szea, kc1_multiplier = szea, kc2_multiplier = szea, kc4_multiplier = szea
condition: model1_data4, perturbations: init_b10 = 0, init_bcar = 0, init_bcry = init_bcry_1, init_ohb10 = 0, init_zea = 0, k5_multiplier = 1, kb1_multiplier = 0, kb2_multiplier = 1, kc1_multiplier = 1, kc2_multiplier = 1, kc4_multiplier = 1
condition: model1_data5, perturbations: init_b10 = 0, init_bcar = 0, init_bcry = 0, init_ohb10 = init_ohb10_1, init_zea = 0, k5_multiplier = 0, kb1_multiplier = 0, kb2_multiplier = 1, kc1_multiplier = 0, kc2_multiplier = 0, kc4_multiplier = 1
condition: model1_data6, perturbations: init_b10 = 0, init_bcar = 0, init_bcry = 0, init_ohb10 = 0, init_zea = init_zea_1, k5_multiplier = szea, kb1_multiplier = 0, kb2_multiplier = 0, kc1_multiplier = 0, kc2_multiplier = 0, kc4_multiplier = szea
experiment: experiment____model1_data1, condition: model1_data1, method: ode, data: sigmaT5/experiment____model1_data1.exp, t_end: 200, n_steps: 200
experiment: experiment____model1_data2, condition: model1_data2, method: ode, data: sigmaT5/experiment____model1_data2.exp, t_end: 200, n_steps: 200
experiment: experiment____model1_data3, condition: model1_data3, method: ode, data: sigmaT5/experiment____model1_data3.exp, t_end: 200, n_steps: 200
experiment: experiment____model1_data4, condition: model1_data4, method: ode, data: sigmaT5/experiment____model1_data4.exp, t_end: 200, n_steps: 200
experiment: experiment____model1_data5, condition: model1_data5, method: ode, data: sigmaT5/experiment____model1_data5.exp, t_end: 200, n_steps: 200
experiment: experiment____model1_data6, condition: model1_data6, method: ode, data: sigmaT5/experiment____model1_data6.exp, t_end: 200, n_steps: 200
noise_model = gaussian, sigma = read_exp_file _SD, time_error = truncated_normal, sigma_t = fit sigma_t__FREE

loguniform_var = init_b10_1 1e-05 1000
loguniform_var = init_bcar1 1e-05 1000
loguniform_var = init_bcar2 1e-05 1000
loguniform_var = init_bcry_1 1e-05 1000
loguniform_var = init_ohb10_1 1e-05 1000
loguniform_var = init_zea_1 1e-05 1000
loguniform_var = k5 1e-05 1000
loguniform_var = kb1 1e-05 1000
loguniform_var = kb2 1e-05 1000
loguniform_var = kc1 1e-05 1000
loguniform_var = kc2 1e-05 1000
loguniform_var = kc4 1e-05 1000
loguniform_var = szea 1e-05 1000
uniform_var = sigma_t__FREE 0.1 30
