# =============================================================================
#  STANDARD fit -- ignore the timing uncertainty (the null / biased baseline)
# =============================================================================
#  Vanhoefer, Nakonecnij, Binder & Hasenauer, "Efficient Bayesian inference for
#  ODE models from experimental data with uncertain measurement times"
#  (bioRxiv 2026.05.09.724053), Fig 5/6, on the carotenoid-cleavage model of
#  Bruno et al. 2016 (J Exp Bot 67:5993).
#
#  This fit scores each datum at its REPORTED time t_k -- the classical assumption
#  that the reported time is exact. On data whose sampling times were actually
#  perturbed (sigmaT5/, generated by perturb_times.py), that assumption biases the
#  estimate: the model is dragged off theta* to explain temporal spread as dynamics.
#  Compare against marginal.conf, which integrates the latent time out (phase 2).
#
#  Data:  sigmaT5/  (theta* + measurement noise, sampled at times perturbed by
#         sigma_t = 5 min but reported at t_k). Point at sigmaT0/ for the control.
#        pybnf -c standard.conf
# -----------------------------------------------------------------------------
output_dir = output/standard

edition = 2
model: model_carotenoid.xml
sbml_backend = bngsim

job_type = gntr
population_size = 20
max_iterations = 300
wall_time_sim = 10
random_seed = 1
verbosity = 1

objective = chi_sq
condition: model1_data1, perturbations: init_b10 = init_b10_1, init_bcar = 0, init_bcry = 0, init_ohb10 = 0, init_zea = 0, k5_multiplier = 0, kb1_multiplier = 0, kb2_multiplier = 1, kc1_multiplier = 1, kc2_multiplier = 0, kc4_multiplier = 1
condition: model1_data2, perturbations: init_b10 = 0, init_bcar = init_bcar1, init_bcry = 0, init_ohb10 = 0, init_zea = 0, k5_multiplier = 1, kb1_multiplier = 1, kb2_multiplier = 1, kc1_multiplier = 0, kc2_multiplier = 0, kc4_multiplier = 0
condition: model1_data3, perturbations: init_b10 = 0, init_bcar = init_bcar2, init_bcry = 0, init_ohb10 = 0, init_zea = 0, k5_multiplier = szea, kb1_multiplier = szea, kb2_multiplier = szea, kc1_multiplier = szea, kc2_multiplier = szea, kc4_multiplier = szea
condition: model1_data4, perturbations: init_b10 = 0, init_bcar = 0, init_bcry = init_bcry_1, init_ohb10 = 0, init_zea = 0, k5_multiplier = 1, kb1_multiplier = 0, kb2_multiplier = 1, kc1_multiplier = 1, kc2_multiplier = 1, kc4_multiplier = 1
condition: model1_data5, perturbations: init_b10 = 0, init_bcar = 0, init_bcry = 0, init_ohb10 = init_ohb10_1, init_zea = 0, k5_multiplier = 0, kb1_multiplier = 0, kb2_multiplier = 1, kc1_multiplier = 0, kc2_multiplier = 0, kc4_multiplier = 1
condition: model1_data6, perturbations: init_b10 = 0, init_bcar = 0, init_bcry = 0, init_ohb10 = 0, init_zea = init_zea_1, k5_multiplier = szea, kb1_multiplier = 0, kb2_multiplier = 0, kc1_multiplier = 0, kc2_multiplier = 0, kc4_multiplier = szea
experiment: experiment____model1_data1, condition: model1_data1, method: ode, data: sigmaT5/experiment____model1_data1.exp
experiment: experiment____model1_data2, condition: model1_data2, method: ode, data: sigmaT5/experiment____model1_data2.exp
experiment: experiment____model1_data3, condition: model1_data3, method: ode, data: sigmaT5/experiment____model1_data3.exp
experiment: experiment____model1_data4, condition: model1_data4, method: ode, data: sigmaT5/experiment____model1_data4.exp
experiment: experiment____model1_data5, condition: model1_data5, method: ode, data: sigmaT5/experiment____model1_data5.exp
experiment: experiment____model1_data6, condition: model1_data6, method: ode, data: sigmaT5/experiment____model1_data6.exp

loguniform_var = init_b10_1 1e-05 1000
loguniform_var = init_bcar1 1e-05 1000
loguniform_var = init_bcar2 1e-05 1000
loguniform_var = init_bcry_1 1e-05 1000
loguniform_var = init_ohb10_1 1e-05 1000
loguniform_var = init_zea_1 1e-05 1000
loguniform_var = k5 1e-05 1000
loguniform_var = kb1 1e-05 1000
loguniform_var = kb2 1e-05 1000
loguniform_var = kc1 1e-05 1000
loguniform_var = kc2 1e-05 1000
loguniform_var = kc4 1e-05 1000
loguniform_var = szea 1e-05 1000
