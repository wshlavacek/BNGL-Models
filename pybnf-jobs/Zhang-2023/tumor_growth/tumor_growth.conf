# =====================================================================================
# Angiogenesis-driven tumor growth (Zhang et al. 2023) -- edition-2 PyBNF fit of the six
# parameters the paper reports as fitted, to the mouse xenograft renal cell carcinoma
# growth curves of Bridgeman et al. (2016) reproduced in Fig. 4D.
#
# Real-world PyBNF edition-2 fitting job derived from:
#   Zhang Y, Popel AS, Bazzazi H. "Combining multikinase tyrosine kinase inhibitors
#   targeting the vascular endothelial growth factor and cluster of differentiation 47
#   signaling pathways is predicted to increase the efficacy of antiangiogenic combination
#   therapies." ACS Pharmacol Transl Sci 2023; 6:710-726. DOI 10.1021/acsptsci.3c00008.
#   Model = Supporting Information File S4 (S4.bngl) + the two equations of the
#   "Computational Model of Angiogenesis-Driven Tumor Growth" section; fit target and
#   validation arm = Fig. 4D; reported parameter values = Table S1.
#   Data: Bridgeman VL et al. Mol Cancer Ther 2016; 15:172-183,
#   DOI 10.1158/1535-7163.MCT-15-0170, as replotted in Fig. 4D.
#
# WHY THIS JOB EXISTS. The published parameterization of the tumor growth model is
#   internally inconsistent, and no single reported set reproduces Fig. 4D:
#     * File S4 sets kTD = 2.999985128 and EC50TD = 0.000278233 -- values that also appear
#       verbatim as the commented-out `kg`/`taug` of a discarded logistic growth law in the
#       same file. With that gate, TD^kTD/(TD^kTD + EC50TD^kTD) is ~1 for every treatment
#       arm, so the growth law reduces to TD*(kg*softmin - kkill)*Cells and the sign of
#       (kg - kkill) is the same in every arm: no kkill can let the control tumor grow
#       while the sunitinib + trametinib tumor shrinks, as Fig. 4D shows it does.
#     * Table S1 reports a different set -- w_OR = 0.3, kTD = 29.2812, EC50TD = 0.5840,
#       kg = 0.2993, klinear = 1.9424 -- whose sharp gate does separate the arms, but
#       reports no kkill at all (File S4 sets it to 0, which cannot shrink a tumor).
#   The Methods say w_OR, k_TD, EC50TD, kg, klinear and kkill were fitted with the MATLAB
#   pattern-search algorithm. This job refits those same six against the digitized Fig. 4D
#   data and recovers a self-consistent set that reproduces all four arms -- one that lands
#   on Table S1's kTD (30.5 vs 29.28), EC50TD (0.573 vs 0.584) and w_OR (0.34 vs 0.3) and on
#   File S4's kg (0.139 vs 0.146). See VALIDATION.md.
#
# EXPERIMENTAL DESIGN -- four arms of one xenograft study, differing only in the two
#   normalized endothelial signals that drive the growth model. Erk and Akt are the peak
#   pERK1/2 and ppAKT of the companion signaling model, normalized to untreated; they are
#   digitized from the simulation bars of Fig. 4B and Fig. 4C:
#       arm          Erk     Akt
#       control      1.000   1.000
#       sunitinib    0.736   0.793
#       trametinib   0.580   1.000
#       combo        0.355   0.793
#   ALL FOUR ARMS ARE FITTED, unlike the paper, which calibrates on the first three and
#   holds the combination arm out for validation. That holdout was run first and does not
#   work: a three-arm calibration fits its own arms to sos = 1.91 but then predicts 2.15-fold
#   GROWTH for the combination arm, where the data shrink to 0.35-fold. The three growing
#   arms simply do not constrain the TD gate -- only the shrinking arm does. The holdout run
#   is reported in VALIDATION.md; this conf fits all four.
#
# FIT DATA -- tumor volume as a fold change, digitized from the open circles of Fig. 4D
#   (control.exp, sunitinib.exp, trametinib.exp, combo.exp). Extraction
#   is documented and reproducible in the model folder's verify_zhang2023.ipynb: page 7 of
#   the article rendered at 1200 dpi, axis calibration from the plotted ticks (30.90 px/day,
#   126.0 px/fold), circle centers by annulus template matching. The model observable
#   Obs_Cells is a Molecules observable (no parens) and starts at Cells_0 = 1.
#
# Run (with BNGPATH set, from this folder):
#   cd pybnf-jobs/Zhang-2023/tumor_growth && pybnf -c tumor_growth.conf
#   python make_reproduction.py
# =====================================================================================

output_dir = output

# Opt into the edition-2 config language (PEtab-aligned condition:/experiment:).
edition = 2

# In-process bngsim backend (the new-era default).
bngl_backend = bngsim

model: tumor_growth.bngl

#######################
### General Options ###
#######################

delete_old_files = 1
verbosity = 1

# The network is 3 species / 2 reactions and a run takes milliseconds, but a trial that
# drives klinear very small makes (kg*Cells/klinear)^psi large and slows CVODES; fail such
# sets fast rather than at the 3600 s default.
wall_time_sim = 30
max_failed_simulations = 200

#######################
### Fitting Options ###
#######################

# Differential evolution -- a GLOBAL metaheuristic, the closest edition-2 analog of the
# authors' MATLAB pattern search. The landscape is not locally convex: EC50TD and kTD enter
# a Hill gate that is effectively a step, so a local method started away from the gate edge
# sees a flat objective in those two directions.
job_type = de

population_size = 60
max_iterations = 300

# No per-point uncertainty is reported in Fig. 4D, so plain sum of squares over the four
# arms. PyBNF reports sos as half the residual sum of squares, so the printed objective is
# SSE/2.
objective = sos

###################
### Conditions  ###
###################
# One condition per treatment arm: the normalized endothelial pERK1/2 and ppAKT that drive
# the growth model, digitized from the simulation bars of Fig. 4B and Fig. 4C. The untreated
# arm needs no condition (Erk = Akt = 1 are the model nominals).

condition: sunitinib,  perturbations: Erk = 0.736, Akt = 0.793
condition: trametinib, perturbations: Erk = 0.580, Akt = 1.000
condition: combo,      perturbations: Erk = 0.355, Akt = 0.793

###################
### Experiments ###
###################
# Four time courses, one per treatment arm; see the design note above on why the paper's
# three-arm calibration is not used.

experiment: control,    data: control.exp
experiment: sunitinib,  condition: sunitinib,  data: sunitinib.exp
experiment: trametinib, condition: trametinib, data: trametinib.exp
experiment: combo,      condition: combo,      data: combo.exp

##################
### Parameters ###
##################
# SIX free parameters, bound to the model ids BY NAME (ADR-0034, no __FREE alias) -- the
# six the Methods of Zhang et al. (2023) name as fitted:
#
#   id       File S4     Table S1     box              role
#   w_OR     0.950956    0.3          0     1          weight of the ERK arm vs the AKT arm
#   kTD      2.99999     29.2812      1     100        Hill coefficient of the TD growth gate
#   EC50TD   0.000278    0.5840       0.01  1          half-maximal TD for the growth gate
#   kg       0.146       0.2993       0.01  1          exponential tumor growth rate (/day)
#   klinear  0.3         1.9424       0.05  10         linear tumor growth rate (/day)
#   kkill    0           (not given)  0.001 1          first-order tumor kill rate (/day)
#
# Boxes are wide because the two published sets disagree by two orders of magnitude on
# EC50TD and by a factor of 10 on kTD; `de` samples the whole box rather than starting from
# a center, so a wide box costs iterations, not correctness. klinear is floored at 0.05 to
# keep (kg*Cells/klinear)^psi inside double precision. Everything else -- S6b, S6t, tau6,
# k6, r5, psi -- keeps its File S4 nominal, as in the paper.
uniform_var    = w_OR    0     1
loguniform_var = kTD     1     100
loguniform_var = EC50TD  0.01  1
loguniform_var = kg      0.01  1
loguniform_var = klinear 0.05  10
loguniform_var = kkill   0.001 1
