[project]
name = "bngl-models"
version = "0.1.0"
description = "Curated BNGL models with independently verified simulation protocols"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scipy>=1.14",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.14.0",
]
notebook = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "nbclient>=0.10",
  "nbformat>=5.10",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
# Figure digitization (skills/curate-model/scripts/digitize.py). Not installed by default:
# only a digitizer needs these, and the source PDFs they read are not committed. The SVG
# route needs neither, just the poppler CLI. Install with `uv sync --group digitize`.
digitize = [
  "pillow>=10.0",
  "pymupdf>=1.24",
]
# The authors'-model check for mapk_adaptive_resistance_frohlich2023 (its run_frohlich2023.py).
# Not installed by default: only that driver needs PySB, which builds the authors' own MARM2.0
# model from their published definition, generates its network through BioNetGen's BNG2.pl
# (set BNGPATH) and compiles its right-hand side. Cython (plus setuptools, which sympy's
# autowrap builds with, and a C compiler) is PySB's fast backend; `--compiler python` runs
# without it. PySB and Cython are pinned exactly, because the numbers the driver commits came
# from these versions. Install with `uv sync --group marm2`.
marm2 = [
  "cython==3.3.1",
  "pysb==1.17.0",
  "setuptools>=70",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/*.ipynb", "models/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
