# <Biology one-liner> (<First-author Year>) -- <ODE|SSA|NFsim>, <network-generating?>.
#
# PyBNF fitting job derived from:
#   <Authors>. "<Title>." <Journal> <Year>; <vol:pages>. PMCID: PMC#######  DOI: ##
# Fit target: <which figure/table the .exp came from, and how it was obtained
#   (source table / digitized panel + calibration)>.
# Archetype: <A hand-built BNGL | B PEtab/SBML-imported | C BPSL constraint-bearing>.
#
# ACCEPTANCE BAR -- declare these BEFORE fitting (references/og-acceptance.md):
#   J* = <value>   tier <T1 published | T2 published-parameter | T3 corpus-best>
#   source: <table/file/row, or the published parameter set evaluated>
#   OG = J_paper - J*, where J_paper = -log_likelihood from Results/information_criteria.txt.
#   solved iff OG < 1.92. Commit jstar.txt + nominal_check.json + best_fit_params.txt +
#   information_criteria.txt, and score with:
#     $PY $SKILL/scripts/score.py <this folder> output
#
# Expressed on PyBNF's edition-2 (new-era) config surface, inside the
# PEtab-exportable subset (verified with scripts/petab_roundtrip.py) -- archetype A/B only.
#
# Run from INSIDE the slug folder (with BNGPATH set) -- all relative paths (model:, data:,
# output_dir) resolve against the working directory:
#   cd pybnf-jobs/<FirstAuthor>-<Year>/<slug> && pybnf -c <slug>.conf

# Results directory, relative -> lands in <slug>/output/ beside the job setup. (Don't
# repeat the slug or a corpus prefix here; the slug folder already provides that context.)
output_dir = output

# Opt into the edition-2 config language (PEtab-aligned experiment:/condition:/data:).
edition = 2

# In-process bngsim backend (the new-era default; required for gradient fits).
# Archetype B (PEtab/SBML-imported) uses `sbml_backend = bngsim` instead, and has no .bngl.
bngl_backend = bngsim

# The model. The experiments below synthesize the *simulation* actions, so the model has no
# simulate/parameter_scan actions -- BUT a network-generating model that needs a network cap
# must KEEP its `generate_network({overwrite=>1,max_stoich=>{...}})` directive (pybnf captures
# it; stripping it -> unbounded network -> silent hang). See references/real-world-anatomy.md.
model: <name>.bngl

#######################
### General Options ###
#######################

delete_old_files = 1
# wall_time_sim = 3600        # raise for large network-generating models

###################
### Conditions  ###
###################
# Only if the experiment perturbs / pre-equilibrates. Perturbations set model params.
# condition: basal,   perturbations: <Stimulus> = 0
# condition: stim,     perturbations: <Stimulus> = 1

###################
### Experiments ###
###################
# Each experiment binds one .exp and synthesizes its simulation. The .exp column
# headers ARE the model observable/function names; the first column is the independent
# variable (time -> time course; a model-parameter name -> parameter_scan / dose).

# Time course:
experiment: timecourse, data: timecourse.exp

# Dose-response (scan over the data's independent-variable column, run to t_end):
# experiment: doseresponse, type: parameter_scan, t_end: 1200, data: doseresponse.exp

# Pre-equilibration then measure (state carried across phases, no reset):
# experiment: <name>, preequilibrate: basal, condition: stim, data: <name>.exp

# BPSL constraints (qualitative facts from the paper). This makes the job NATIVE-ONLY
# (not PEtab-exportable) -- verify with `job_type = check`, not petab_roundtrip.py.
# See references/bpsl-constraints.md.
#   Data fusion (quantitative + qualitative on one experiment):
# experiment: timecourse, data: timecourse.exp, timecourse.prop
#   Constraint-only (t_end required; the .prop alone defines the job):
# experiment: qual, t_end: <T>, n_steps: <N>, data: qual.prop
# constraint_scale = 1.0        # global weight on the qualitative penalty block

#######################
### Fitting Options ###
#######################

# Choose by RUNNING candidates, not by assumption. Corpus usage: de 25, gntr 20, ss 10,
# check 6, cmaes 5, lbfgs 4, am 1.
#   gntr  -- Fisher/Gauss-Newton trust region; the gradient workhorse, and the only gradient
#            method that handles an ESTIMATED noise scale (plain trf refuses it). Needs bngsim
#            and differentiable dynamics (a model with discrete events is refused).
#   cmaes -- where the gradient path refuses the problem, or the landscape is multimodal.
#   de/ss -- a first global sweep on a small model.
#   am    -- when the paper reports posteriors rather than point estimates.
#   check -- constraint satisfaction only (archetype C companion conf).
job_type = gntr

# OBJECTIVE: a MODELING choice (references/og-acceptance.md section 2). Under edition 2 every
# option below is a likelihood -- `objective = sos` resolves to Gaussian(sigma = 1) -- so all of
# them write information_criteria.txt after a fit and can be scored. (Only the LEGACY edition-1
# `objfunc = sos` path is unscoreable: it resolves to SumOfSquaresObjective, objective.py:73-96.)
#   .exp has _SD columns ................ objective = chi_sq
#   unweighted least squares ............ objective = sos   (sigma == 1; faithful and scoreable)
#                                         `noise_model = normal, sigma = fix_at 1` is the same
#                                         thing spelled explicitly
#   noise scale unknown, to be fitted ... noise_model = normal, sigma = fit sd_<obs>
#                                         (pair with job_type = gntr)
objective = chi_sq

# Budget is part of the result: 20 x 500 is a DEFAULT, not a tuned setting. If the job needs
# more to reach its basin, ship that and say so in the slug README.
max_iterations = 500
population_size = 20
verbosity = 2
# refine = 1                  # polish the best fit with a local optimizer

##################
### Parameters ###
##################
# One free var per fitted model parameter, bound to the model id BY NAME (ADR-0034):
# no __FREE alias. Bracket the paper's published value.
#   loguniform_var <id> <lo> <hi>   -- rate constants over decades
#   uniform_var    <id> <lo> <hi>   -- linear scaling factors
loguniform_var = <rate_id> 0.001 1000
# uniform_var = <scale_id> 0 <hi>
